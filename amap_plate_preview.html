<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>北京板块高德绘制版</title>
<style>
:root {
  --ink:#172126;
  --muted:#6b7780;
  --line:#d9e3df;
  --paper:#f6f2e8;
  --card:#fffdf7;
  --green:#0f8c7f;
  --orange:#f27a1a;
  --blue:#2f6fd6;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg, #f6f2e8 0%, #e6f0ec 52%, #fdf8ed 100%);
}
.shell { display:grid; grid-template-columns:360px minmax(0, 1fr); min-height:100vh; }
.panel {
  position:relative;
  z-index:2;
  padding:22px;
  border-right:1px solid rgba(15,140,127,.18);
  background:rgba(255,253,247,.92);
  backdrop-filter:blur(14px);
  box-shadow:14px 0 34px rgba(40,73,68,.12);
}
.eyebrow { color:var(--green); font-size:12px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
h1 { margin:8px 0 10px; font-size:28px; line-height:1.16; letter-spacing:-.04em; }
.intro { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.75; }
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
.stat { padding:14px; border:1px solid var(--line); border-radius:18px; background:#fff; }
.stat strong { display:block; font-size:24px; line-height:1; color:var(--green); }
.stat span { display:block; margin-top:7px; color:var(--muted); font-size:12px; }
.search { width:100%; height:42px; padding:0 14px; border:1px solid var(--line); border-radius:14px; outline:none; background:#fff; color:var(--ink); font-weight:800; }
.search:focus { border-color:var(--green); box-shadow:0 0 0 4px rgba(15,140,127,.11); }
.legend { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
.legend span { display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border:1px solid var(--line); border-radius:999px; background:#fff; color:#46535a; font-size:12px; font-weight:800; }
.legend i { width:9px; height:9px; border-radius:999px; display:inline-block; }
.plate-list { display:grid; gap:8px; max-height:38vh; margin-top:10px; padding-right:4px; overflow:auto; }
.plate-item {
  border:1px solid var(--line);
  border-radius:16px;
  padding:11px 12px;
  background:#fff;
  cursor:pointer;
  transition:.18s ease;
}
.plate-item:hover, .plate-item.active { border-color:var(--green); transform:translateY(-1px); box-shadow:0 10px 22px rgba(15,140,127,.13); }
.plate-item b { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
.plate-item small { display:block; margin-top:6px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.map-wrap { position:relative; min-width:0; }
#map { width:100%; height:100vh; }
.detail-card {
  position:absolute;
  right:22px;
  top:22px;
  width:min(360px, calc(100vw - 420px));
  border:1px solid rgba(15,140,127,.2);
  border-radius:24px;
  padding:18px;
  background:rgba(255,253,247,.94);
  box-shadow:0 18px 48px rgba(36,64,60,.2);
  backdrop-filter:blur(14px);
}
.detail-card h2 { margin:0 0 4px; font-size:22px; }
.detail-card p { margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.6; }
.kv { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
.kv div { padding:11px; border:1px solid var(--line); border-radius:14px; background:#fff; }
.kv span { display:block; color:var(--muted); font-size:12px; }
.kv b { display:block; margin-top:5px; color:var(--ink); font-size:18px; }
.source { padding-top:12px; border-top:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.65; }
.source a { color:var(--blue); text-decoration:none; }
.amap-marker-label {
  min-width:78px;
  padding:6px 9px;
  border:1px solid rgba(15,140,127,.32);
  border-radius:999px;
  background:rgba(255,253,247,.94);
  color:#0d5f58;
  box-shadow:0 7px 18px rgba(18,72,66,.16);
  font-size:12px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
}
.amap-marker-label em { color:var(--orange); font-style:normal; }
.loading {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  padding:14px 18px;
  border-radius:18px;
  background:#fffdf7;
  box-shadow:0 18px 45px rgba(36,64,60,.18);
  color:var(--green);
  font-weight:900;
}
.error { color:#b42318; }
.home-link {
  display:inline-flex;
  align-items:center;
  height:34px;
  margin-top:10px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--green);
  text-decoration:none;
  font-size:12px;
  font-weight:900;
}
@media (max-width:900px) {
  .shell { grid-template-columns:1fr; }
  .panel { min-height:auto; border-right:0; border-bottom:1px solid rgba(15,140,127,.18); }
  #map { height:68vh; }
  .plate-list { max-height:220px; }
  .detail-card { position:static; width:auto; margin:12px; }
}
</style>
<script>
window._AMapSecurityConfig = window._AMapSecurityConfig || {};
</script>
<script src="https://webapi.amap.com/loader.js"></script>
</head>
<body>
<div class="shell">
  <aside class="panel">
    <div class="eyebrow">AMap JavaScript API v2</div>
    <h1>北京板块高德绘制版</h1>
    <p class="intro">用高德 JS API 原生绘制北京边界、38 个自定义板块中心圈和板块标签。圆圈是辅助定位范围，不代表真实板块边界。</p>
    <input id="search" class="search" placeholder="搜索板块、行政区或项目" />
    <div class="stat-grid">
      <div class="stat"><strong id="plateCount">-</strong><span>板块中心点</span></div>
      <div class="stat"><strong id="projectCount">-</strong><span>覆盖项目</span></div>
      <div class="stat"><strong id="maySuites">-</strong><span>26年5月去化套数</span></div>
      <div class="stat"><strong id="mayAmount">-</strong><span>26年5月金额/亿元</span></div>
    </div>
    <div id="legend" class="legend"></div>
    <div id="plateList" class="plate-list"></div>
    <a class="home-link" href="./index.html">返回主驾驶舱</a>
  </aside>
  <main class="map-wrap">
    <div id="map"></div>
    <div id="loading" class="loading">正在加载高德地图...</div>
    <section id="detail" class="detail-card" aria-live="polite"></section>
  </main>
</div>
<script>
const AMAP_JS_KEY = "64bc454252abac7b8194dabe75cc6750";
const format0 = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 });
const format2 = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 2 });
const state = { map: null, plates: [], overlays: [], overlayByPlate: new Map(), activePlate: "" };

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[char]));
}

function rgba(hex, alpha) {
  const value = String(hex || "#0f8c7f").replace("#", "");
  const full = value.length === 3 ? value.split("").map(x => x + x).join("") : value;
  const r = parseInt(full.slice(0, 2), 16);
  const g = parseInt(full.slice(2, 4), 16);
  const b = parseInt(full.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function setLoading(message, isError = false) {
  const el = document.getElementById("loading");
  el.textContent = message;
  el.classList.toggle("error", isError);
  el.style.display = message ? "block" : "none";
}

function readFeatures(geojson) {
  if (!geojson) return [];
  if (geojson.type === "FeatureCollection") return geojson.features || [];
  if (geojson.type === "Feature") return [geojson];
  return [{ type: "Feature", properties: {}, geometry: geojson }];
}

function boundaryPaths(geojson) {
  const paths = [];
  for (const feature of readFeatures(geojson)) {
    const geometry = feature.geometry || {};
    if (geometry.type === "Polygon") {
      for (const polygon of [geometry.coordinates]) {
        if (polygon?.[0]?.length) paths.push(polygon[0]);
      }
    }
    if (geometry.type === "MultiPolygon") {
      for (const polygon of geometry.coordinates || []) {
        if (polygon?.[0]?.length) paths.push(polygon[0]);
      }
    }
  }
  return paths;
}

function updateStats(features) {
  const totals = features.reduce((acc, feature) => {
    const p = feature.properties || {};
    acc.projects += Number(p.projectCount || 0);
    acc.suites += Number(p.maySuites || 0);
    acc.amount += Number(p.mayAmount || 0);
    return acc;
  }, { projects: 0, suites: 0, amount: 0 });
  document.getElementById("plateCount").textContent = format0.format(features.length);
  document.getElementById("projectCount").textContent = format0.format(totals.projects);
  document.getElementById("maySuites").textContent = format0.format(totals.suites);
  document.getElementById("mayAmount").textContent = format2.format(totals.amount / 10000);
}

function renderLegend(features) {
  const groups = new Map();
  for (const feature of features) {
    const p = feature.properties || {};
    if (p.group && !groups.has(p.group)) groups.set(p.group, p.color || "#0f8c7f");
  }
  document.getElementById("legend").innerHTML = [...groups.entries()].map(([name, color]) => (
    `<span><i style="background:${escapeHtml(color)}"></i>${escapeHtml(name)}</span>`
  )).join("");
}

function detailHtml(feature) {
  const p = feature.properties || {};
  const [lng, lat] = feature.geometry?.coordinates || [];
  return `
    <h2>${escapeHtml(p.plate || "板块")}</h2>
    <p>${escapeHtml(p.group || "-")} · ${escapeHtml(p.district || "-")} · ${escapeHtml(p.confidence || "待核")}置信度</p>
    <div class="kv">
      <div><span>项目数</span><b>${format0.format(p.projectCount || 0)} 个</b></div>
      <div><span>在售项目</span><b>${format0.format(p.activeProjectCount || 0)} 个</b></div>
      <div><span>26年5月套数</span><b>${format0.format(p.maySuites || 0)} 套</b></div>
      <div><span>26年5月均价</span><b>${p.mayAvgPrice ? format0.format(p.mayAvgPrice) : "-"} 元/㎡</b></div>
    </div>
    <p><b>代表项目：</b>${escapeHtml(p.representativeProjects || p.projects || "暂无")}</p>
    <div class="source">
      坐标来源：${escapeHtml(p.source || "-")}；匹配对象：${escapeHtml(p.matched || "-")}。<br>
      中心坐标：${Number(lng).toFixed(6)}, ${Number(lat).toFixed(6)}。<br>
      ${p.sourceUrl ? `<a href="${escapeHtml(p.sourceUrl)}" target="_blank" rel="noreferrer">查看坐标来源</a>` : ""}
    </div>
  `;
}

function selectPlate(feature, shouldMove = true) {
  const p = feature.properties || {};
  state.activePlate = p.plate || "";
  document.getElementById("detail").innerHTML = detailHtml(feature);
  document.querySelectorAll(".plate-item").forEach(item => {
    item.classList.toggle("active", item.dataset.plate === state.activePlate);
  });
  for (const [plate, bundle] of state.overlayByPlate.entries()) {
    const active = plate === state.activePlate;
    bundle.circle.setOptions({
      strokeWeight: active ? 4 : 2,
      fillOpacity: active ? 0.24 : 0.13,
      zIndex: active ? 50 : 10
    });
    bundle.marker.setzIndex(active ? 100 : 20);
  }
  if (shouldMove && state.map && feature.geometry?.coordinates) {
    state.map.setZoomAndCenter(Math.max(state.map.getZoom(), 12), feature.geometry.coordinates);
  }
}

function renderList(features) {
  const el = document.getElementById("plateList");
  el.innerHTML = features.map(feature => {
    const p = feature.properties || {};
    return `
      <article class="plate-item" data-plate="${escapeHtml(p.plate)}">
        <b><span>${escapeHtml(p.plate)}</span><span>${format0.format(p.projectCount || 0)}盘</span></b>
        <small>${escapeHtml(p.representativeProjects || p.matched || "")}</small>
      </article>
    `;
  }).join("");
  el.querySelectorAll(".plate-item").forEach(item => {
    item.addEventListener("click", () => {
      const feature = state.plates.find(row => row.properties?.plate === item.dataset.plate);
      if (feature) selectPlate(feature);
    });
  });
}

function drawBoundary(AMap, geojson) {
  const polygons = [];
  for (const path of boundaryPaths(geojson)) {
    const polygon = new AMap.Polygon({
      path,
      strokeColor: "#0f8c7f",
      strokeWeight: 2,
      strokeOpacity: 0.78,
      fillColor: "#0f8c7f",
      fillOpacity: 0.035,
      bubble: true,
      zIndex: 2
    });
    polygons.push(polygon);
  }
  if (polygons.length) state.map.add(polygons);
  return polygons;
}

function drawPlates(AMap, features) {
  const overlays = [];
  for (const feature of features) {
    const p = feature.properties || {};
    const position = feature.geometry?.coordinates;
    if (!Array.isArray(position) || position.length < 2) continue;
    const color = p.color || "#0f8c7f";
    const radius = Math.max(900, Math.min(2600, 950 + Number(p.projectCount || 0) * 280));
    const circle = new AMap.Circle({
      center: position,
      radius,
      strokeColor: color,
      strokeWeight: 2,
      strokeOpacity: 0.95,
      fillColor: color,
      fillOpacity: 0.13,
      zIndex: 10,
      bubble: true
    });
    const marker = new AMap.Marker({
      position,
      title: p.plate || "",
      offset: new AMap.Pixel(-42, -36),
      content: `<div class="amap-marker-label">${escapeHtml(p.plate)} <em>${format0.format(p.projectCount || 0)}盘</em></div>`,
      zIndex: 20
    });
    circle.on("click", () => selectPlate(feature, false));
    marker.on("click", () => selectPlate(feature));
    state.overlayByPlate.set(p.plate, { circle, marker, feature });
    overlays.push(circle, marker);
  }
  state.map.add(overlays);
  state.overlays = overlays;
  state.map.setFitView(overlays, false, [70, 70, 70, 410], 11);
}

function applySearch(value) {
  const keyword = value.trim().toLowerCase();
  const visibleFeatures = [];
  for (const feature of state.plates) {
    const p = feature.properties || {};
    const haystack = [p.plate, p.group, p.district, p.projects, p.matched, p.source].join(" ").toLowerCase();
    const visible = !keyword || haystack.includes(keyword);
    const bundle = state.overlayByPlate.get(p.plate);
    if (bundle) {
      visible ? bundle.circle.show() : bundle.circle.hide();
      visible ? bundle.marker.show() : bundle.marker.hide();
    }
    if (visible) visibleFeatures.push(feature);
  }
  renderList(visibleFeatures);
  if (visibleFeatures.length) {
    selectPlate(visibleFeatures[0], false);
  }
}

async function boot() {
  try {
    if (!window.AMapLoader) throw new Error("高德 JS API Loader 未加载，请检查网络或域名白名单。");
    const [AMap, centers, boundary] = await Promise.all([
      window.AMapLoader.load({
        key: AMAP_JS_KEY,
        version: "2.0",
        plugins: ["AMap.Scale", "AMap.ToolBar"]
      }),
      fetch(`./beijing_plate_centers.geojson?v=${Date.now()}`).then(r => r.json()),
      fetch(`./beijing_boundary.geojson?v=${Date.now()}`).then(r => r.json())
    ]);
    state.map = new AMap.Map("map", {
      viewMode: "2D",
      zoom: 10,
      center: [116.405285, 39.904989],
      mapStyle: "amap://styles/normal",
      resizeEnable: true
    });
    state.map.addControl(new AMap.Scale());
    state.map.addControl(new AMap.ToolBar({ position: { right: "22px", bottom: "22px" } }));
    const features = readFeatures(centers).sort((a, b) => {
      const groupCompare = String(a.properties?.group || "").localeCompare(String(b.properties?.group || ""), "zh-Hans-CN");
      if (groupCompare) return groupCompare;
      return String(a.properties?.plate || "").localeCompare(String(b.properties?.plate || ""), "zh-Hans-CN");
    });
    state.plates = features;
    drawBoundary(AMap, boundary);
    drawPlates(AMap, features);
    updateStats(features);
    renderLegend(features);
    renderList(features);
    if (features[0]) selectPlate(features[0], false);
    document.getElementById("search").addEventListener("input", event => applySearch(event.target.value));
    setLoading("");
  } catch (error) {
    console.error(error);
    setLoading(`高德绘制失败：${error.message || error}`, true);
  }
}

boot();
</script>
</body>
</html>
