<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>北京房地产板块投资分析平台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root { --bg:#141414; --panel:#1A1A1A; --panel2:#222; --line:#333; --text:#E4E3E0; --muted:#8a8f99; --orange:#f97316; --orange2:#ea580c; }
* { box-sizing:border-box; }
body { margin:0; height:100vh; overflow:hidden; color:var(--text); background:#141414; font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
.app { height:100vh; display:grid; grid-template-rows:auto 1fr; background:#141414; }
.topbar { position:relative; min-height:96px; display:block; padding:0; border-bottom:1px solid #2A2A2A; background:#141414; box-shadow:0 10px 28px rgba(0,0,0,.32); z-index:20; }
.topbar-main { height:52px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 18px; }
.topbar-meta { display:flex; align-items:center; gap:10px; }
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand i { width:4px; height:26px; border-radius:99px; background:var(--orange); }
.brand h1 { margin:0; font-size:20px; font-weight:950; letter-spacing:0; white-space:nowrap; }
.filter-toolbar { min-height:44px; display:flex; align-items:center; gap:8px; padding:0 18px; border-top:1px solid #2A2A2A; background:#181818; }
.filters { flex:1 1 auto; display:flex; align-items:center; justify-content:flex-start; gap:2px; min-width:0; flex-wrap:nowrap; overflow:visible; scrollbar-width:none; }
.filters::-webkit-scrollbar { display:none; }
.seg { position:relative; flex:0 0 auto; display:flex; align-items:center; height:42px; background:transparent; overflow:visible; }
.seg button { height:42px; min-width:70px; border:0; border-radius:4px; color:#8f96a3; background:transparent; font-size:14px; font-weight:700; cursor:pointer; }
.seg button.active { background:var(--orange2); color:white; box-shadow:none; }
.filter-trigger { position:relative; flex:0 0 auto; height:42px; min-width:88px; max-width:150px; padding:0 28px 0 12px; border:0; background:transparent; color:#E4E3E0; font-size:14px; font-weight:800; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.filter-trigger::after { content:""; position:absolute; right:10px; top:50%; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-65%) rotate(45deg); opacity:.72; }
.multi-select.has-value .filter-trigger { color:#fff; background:#252525; }
.filter-menu { display:none; position:absolute; top:43px; left:0; z-index:3000; width:max(220px, 100%); max-height:310px; overflow:auto; padding:8px; border:1px solid #3a3a3a; border-radius:7px; background:#1A1A1A; box-shadow:0 18px 48px rgba(0,0,0,.38); }
.seg.open .filter-menu { display:block; }
.filter-option { display:flex; align-items:center; gap:8px; min-height:32px; padding:6px 8px; border-radius:7px; color:#e5e7eb; font-size:13px; font-weight:800; cursor:pointer; }
.filter-option:hover { background:#252525; }
.filter-option input { width:14px; height:14px; margin:0; accent-color:#f97316; }
.filter-empty { padding:10px; color:#8a8f99; font-size:12px; }
.reset-filters { flex:0 0 auto; height:42px; padding:0 12px; border:0; border-radius:4px; background:transparent; color:#8a8f99; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; }
.reset-filters:hover { border-color:#f97316; color:#fff; }
.search { width:min(340px, 28vw); height:42px; display:flex; align-items:stretch; flex:0 1 340px; padding:0; border:1px solid #333; border-radius:5px; background:#1E1E1E; color:#6f7683; overflow:hidden; }
.search input { flex:1; min-width:0; padding:0 13px; border:0; outline:0; background:transparent; color:#E4E3E0; font-size:14px; }
.search-submit { position:relative; flex:0 0 50px; width:50px; border:0; background:var(--orange2); cursor:pointer; }
.search-submit:hover { filter:brightness(.96); }
.search-icon { position:absolute; left:50%; top:50%; width:16px; height:16px; border:2px solid #fff; border-radius:50%; transform:translate(-58%,-58%); }
.search-icon::after { content:""; position:absolute; right:-6px; bottom:-4px; width:8px; height:2px; border-radius:2px; background:#fff; transform:rotate(45deg); transform-origin:left center; }
.cutoff { height:36px; display:flex; align-items:center; gap:8px; padding:0 12px; border:1px solid #333; border-radius:7px; background:#252525; color:#9ca3af; font-size:12px; font-weight:800; white-space:nowrap; }
.cutoff i { color:var(--orange); font-style:normal; }
.cutoff b { color:var(--orange); font-size:15px; letter-spacing:.2px; }
.view-switch { display:flex; height:34px; border:1px solid #333; border-radius:6px; background:#1E1E1E; overflow:hidden; }
.view-switch button { height:34px; min-width:60px; border:0; border-right:1px solid #333; background:transparent; color:#8f96a3; font-weight:800; cursor:pointer; }
.view-switch button:last-child { border-right:0; }
.view-switch button.active { background:var(--orange2); color:#fff; }
select { height:36px; border:1px solid #333; border-radius:7px; background:#1E1E1E; color:#E4E3E0; padding:0 10px; font-size:13px; font-weight:800; outline:none; }
.stage { position:relative; overflow:hidden; background:#e8e2d6; }
.stage::before { display:none; }
.map-card { position:absolute; inset:0; display:grid; grid-template-columns:clamp(310px, 22vw, 360px) minmax(0, 1fr); }
.ranking-panel { position:relative; z-index:4; min-width:0; display:grid; grid-template-rows:auto minmax(0, 1fr); border-right:1px solid #dadce0; background:#fff; color:#202124; box-shadow:4px 0 16px rgba(60,64,67,.15); overflow:hidden; }
.ranking-head { padding:22px 20px 18px; color:#fff; background:linear-gradient(135deg,#1769dc 0%,#5d55bd 58%,#bf3f96 100%); }
.ranking-headline { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.ranking-head h2 { margin:0; font-size:23px; line-height:1.2; font-weight:950; letter-spacing:0; }
.ranking-head p { margin:8px 0 0; color:rgba(255,255,255,.88); font-size:13px; font-weight:700; }
.ranking-metrics { display:flex; margin-top:16px; width:100%; border:1px solid rgba(255,255,255,.62); border-radius:7px; overflow:hidden; }
.ranking-metrics button { flex:1 1 0; height:34px; min-width:0; padding:0 8px; border:0; border-right:1px solid rgba(255,255,255,.48); background:rgba(255,255,255,.08); color:#fff; font-size:13px; font-weight:900; cursor:pointer; }
.ranking-metrics button:last-child { border-right:0; }
.ranking-metrics button:hover { background:rgba(255,255,255,.18); }
.ranking-metrics button.active { background:#fff; color:#4f56bd; }
.ranking-body { min-height:0; overflow:auto; background:#fff; }
.ranking-columns,.ranking-row { display:grid; grid-template-columns:48px minmax(0,1fr) 92px; align-items:center; column-gap:8px; }
.ranking-columns { position:sticky; top:0; z-index:2; min-height:48px; padding:0 14px; border-bottom:1px solid #dfe4ed; background:#f5f7fb; color:#4b5563; font-size:12px; font-weight:900; }
.ranking-columns span:last-child { text-align:right; }
.ranking-row { min-height:66px; padding:9px 14px; border-bottom:1px solid #e7ebf2; background:#fff; cursor:pointer; transition:background .15s ease; }
.ranking-row:nth-child(odd) { background:#fafbfc; }
.ranking-row:hover { background:#eef4ff; }
.ranking-rank { width:34px; height:34px; display:grid; place-items:center; color:#6b7280; font-size:17px; font-weight:950; }
.ranking-row.top-1 .ranking-rank,.ranking-row.top-2 .ranking-rank,.ranking-row.top-3 .ranking-rank { color:#fff; clip-path:polygon(0 0,100% 0,82% 100%,0 100%); }
.ranking-row.top-1 .ranking-rank { background:#ff4e6a; }
.ranking-row.top-2 .ranking-rank { background:#ff9500; }
.ranking-row.top-3 .ranking-rank { background:#ffb51b; }
.ranking-project { min-width:0; }
.ranking-project strong { display:block; overflow:hidden; color:#202124; font-size:14px; font-weight:900; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
.ranking-project span { display:block; margin-top:4px; overflow:hidden; color:#7b8491; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
.ranking-value { color:#202124; font-size:14px; font-weight:950; text-align:right; white-space:nowrap; }
.ranking-empty { min-height:220px; display:grid; place-items:center; padding:28px; color:#7b8491; font-size:13px; text-align:center; }
.map-surface { position:relative; width:100%; height:100%; border:0; border-radius:0; background:#e8e2d6; box-shadow:none; overflow:hidden; }
.map-surface::after { content:""; position:absolute; inset:0; background:transparent; pointer-events:none; z-index:3; }
.map-surface.real-mode::after { opacity:0; }
.abstract-layer { display:none; }
.real-map { position:absolute; inset:0; z-index:1; opacity:1; pointer-events:auto; transition:opacity .32s ease; background:#e8e2d6; }
.map-surface.real-mode .real-map { opacity:1; pointer-events:auto; }
.map-surface.real-mode .abstract-layer { opacity:1; pointer-events:none; transform:none; }
.leaflet-container { background:#f2efe9; font-family:inherit; }
.leaflet-control-zoom a { background:#fff; color:#222; border-color:#d1d5db; }
.leaflet-control-attribution { display:none; }
.map-control-bar { position:absolute; left:18px; bottom:24px; z-index:10; display:flex; align-items:flex-end; gap:10px; max-width:calc(100vw - 36px); pointer-events:none; }
.map-control-stack { display:flex; flex-direction:column; overflow:hidden; border:1px solid rgba(17,24,39,.15); border-radius:8px; background:rgba(255,255,255,.94); box-shadow:0 6px 18px rgba(0,0,0,.16); backdrop-filter:blur(10px); pointer-events:auto; }
.map-zoom-dock { display:flex; flex-direction:column; }
.map-control-stack button { width:38px; height:38px; border:0; border-bottom:1px solid rgba(17,24,39,.12); background:transparent; color:#111827; font-size:20px; font-weight:900; line-height:1; cursor:pointer; display:grid; place-items:center; }
.map-control-stack button:last-child { border-bottom:0; }
.map-control-stack button:hover { background:#f97316; color:#fff; }
.map-control-stack button.active { background:#fff7ed; color:#ea580c; }
.map-icon-btn { font-size:17px; }
.map-icon-btn.info-icon { font-family:Georgia,serif; font-size:18px; font-weight:900; }
.plate-marker { display:grid; place-items:center; border-radius:999px; background:#f97316; color:#fff; font-weight:950; font-size:12px; border:2px solid #fff; box-shadow:0 6px 18px rgba(0,0,0,.22),0 0 0 4px rgba(249,115,22,.18); white-space:nowrap; }
.plate-marker.active { background:#e11d48; box-shadow:0 8px 22px rgba(0,0,0,.26),0 0 0 5px rgba(225,29,72,.18); }
.plate-label-marker { height:32px; display:inline-flex; align-items:center; gap:7px; padding:0 10px; border:2px solid #f97316; border-radius:999px; background:rgba(255,255,255,.94); color:#1f2937; box-shadow:0 8px 22px rgba(0,0,0,.20),0 0 0 4px rgba(249,115,22,.14); white-space:nowrap; }
.plate-label-marker strong { font-size:13px; line-height:1; font-weight:950; }
.plate-label-marker em { min-width:28px; padding:3px 6px; border-radius:999px; background:#f97316; color:#fff; font-style:normal; font-size:11px; font-weight:950; text-align:center; }
.plate-label-marker.active { border-color:#e11d48; box-shadow:0 10px 26px rgba(0,0,0,.25),0 0 0 5px rgba(225,29,72,.16); transform:scale(1.04); }
.plate-label-marker.active em { background:#e11d48; }
.project-marker { display:grid; place-items:center; border-radius:999px; background:#111827; border:2px solid #fff; box-shadow:0 5px 14px rgba(0,0,0,.28); }
.project-marker.active { background:#f97316; box-shadow:0 7px 18px rgba(0,0,0,.32),0 0 0 5px rgba(249,115,22,.22); }
.project-square { display:block; width:14px; height:14px; border:1px solid rgba(255,255,255,.86); box-shadow:0 4px 10px rgba(0,0,0,.24); }
.map-title-banner { position:absolute; left:50%; top:94px; transform:translateX(-50%); z-index:8; padding:8px 18px; border-radius:4px; background:#059b9b; color:white; font-size:18px; font-weight:950; box-shadow:0 10px 24px rgba(0,0,0,.20); pointer-events:none; }
.map-legend { display:none; position:absolute; left:70px; bottom:24px; z-index:9; width:min(360px, calc(100vw - 100px)); padding:10px 12px; border:1px solid rgba(14,165,163,.55); border-radius:8px; background:rgba(255,255,255,.94); color:#333; box-shadow:0 8px 22px rgba(0,0,0,.16); font-size:13px; backdrop-filter:blur(10px); }
.map-legend.open { display:block; }
.map-legend h3 { margin:0 0 8px; font-size:16px; }
.map-legend p { margin:0 0 8px; color:#5b616b; font-size:12px; line-height:1.45; }
.map-legend p:last-child { margin-bottom:0; }
.map-legend span { display:flex; align-items:center; gap:8px; margin:5px 0; }
.map-legend i { width:24px; height:18px; display:inline-block; }
.year-rail { min-width:0; max-width:min(520px, calc(100vw - 88px)); height:38px; display:flex; align-items:center; gap:5px; padding:4px; border:1px solid rgba(17,24,39,.15); border-radius:8px; background:rgba(255,255,255,.94); box-shadow:0 6px 18px rgba(0,0,0,.16); backdrop-filter:blur(10px); color:#374151; overflow-x:auto; scrollbar-width:none; pointer-events:auto; }
.year-rail::-webkit-scrollbar { display:none; }
.year-rail h3 { flex:0 0 auto; margin:0 4px 0 6px; font-size:12px; font-weight:950; color:#0f172a; white-space:nowrap; }
.year-rail button { flex:0 0 auto; min-width:52px; height:30px; margin:0; border:0; border-radius:7px; background:transparent; color:#6b7280; font-size:13px; font-weight:900; cursor:pointer; }
.year-rail button:hover { background:rgba(15,23,42,.08); color:#111827; }
.year-rail button.active { background:#f97316; color:#fff; box-shadow:0 4px 12px rgba(249,115,22,.24); }
.leaflet-tooltip.plate-label { background:rgba(255,255,255,.94); color:#111827; border:1px solid rgba(17,24,39,.12); border-radius:5px; padding:4px 8px; box-shadow:0 8px 20px rgba(0,0,0,.18); font-size:12px; font-weight:900; }
.leaflet-tooltip.project-label { background:rgba(17,24,39,.94); color:#fff; border:0; border-radius:5px; padding:4px 8px; font-size:12px; font-weight:800; }
.leaflet-tooltip::before { display:none; }
.leaflet-interactive.plate-area { filter:drop-shadow(0 0 10px rgba(249,115,22,.30)); }
.outline { display:none; }
.outline path { fill:transparent; stroke:#595959; stroke-width:.7; }
.sector { position:absolute; width:44px; height:44px; transform:translate(-50%,-50%); display:grid; place-items:center; cursor:pointer; z-index:4; pointer-events:auto; }
.sector-dot { width:11px; height:11px; border-radius:50%; background:#556172; transition:all .22s ease; box-shadow:0 0 0 0 rgba(249,115,22,0); }
.sector-label { position:absolute; top:28px; left:50%; transform:translateX(-50%); padding:4px 8px; border-radius:5px; background:rgba(255,255,255,.82); color:#374151; border:1px solid rgba(17,24,39,.10); font-size:11px; font-weight:850; white-space:nowrap; transition:all .22s ease; box-shadow:0 5px 14px rgba(0,0,0,.12); }
.sector:hover .sector-dot { width:17px; height:17px; background:#d8dee8; }
.sector:hover .sector-label { color:#d8dee8; background:#333; }
.sector.active .sector-dot { width:26px; height:26px; background:var(--orange); box-shadow:0 0 0 12px rgba(249,115,22,.18), 0 14px 34px rgba(0,0,0,.55); }
.sector.active .sector-label { top:36px; background:var(--orange2); color:#fff; font-size:13px; font-weight:950; }
.floating-hint { position:absolute; left:30px; bottom:26px; display:flex; align-items:center; gap:9px; padding:10px 18px; border:1px solid rgba(17,24,39,.12); border-radius:999px; background:rgba(255,255,255,.86); color:#4b5563; font-size:13px; z-index:8; box-shadow:0 8px 22px rgba(0,0,0,.12); }
.hover-card { position:absolute; display:none; width:300px; padding:18px; border:1px solid #454545; border-radius:12px; background:#262626ee; box-shadow:0 26px 70px rgba(0,0,0,.46); z-index:10; pointer-events:none; }
.hover-card h3 { margin:0 0 12px; font-size:22px; font-weight:950; display:flex; justify-content:space-between; align-items:center; }
.hover-card small { color:#9ca3af; font-size:11px; background:#333; padding:4px 7px; border-radius:5px; }
.stat-row { display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid #444; color:#a7adb8; font-size:13px; }
.stat-row b { color:#fff; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
.stat-row .hot { color:var(--orange); font-weight:950; }
.overview { position:absolute; left:50%; bottom:36px; transform:translateX(-50%); width:min(650px, 50vw); display:flex; align-items:center; justify-content:space-between; padding:20px 26px; border:1px solid #3a3a3a; border-radius:22px; background:rgba(47,47,47,.78); backdrop-filter:blur(12px); box-shadow:0 26px 70px rgba(0,0,0,.42); z-index:5; }
.overview h3 { margin:0; font-size:16px; }
.overview p { margin:4px 0 0; color:#9ca3af; font-size:12px; }
.overview strong { font-size:28px; color:#fff; }
.overview span { color:#9ca3af; font-size:12px; }
.drawer { position:absolute; top:18px; right:18px; bottom:18px; width:min(540px, calc(100vw - 36px)); transform:translateX(calc(100% + 24px)); transition:transform .35s cubic-bezier(.2,.8,.2,1); background:#1A1A1A; border:1px solid #333; border-radius:8px; box-shadow:-22px 0 60px rgba(0,0,0,.45); z-index:2000; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; }
.drawer.open { transform:none; }
.drawer.with-detail { width:min(520px, 54vw); }
.drawer.fullscreen { inset:14px; width:auto; transform:none; border-radius:12px; z-index:2100; box-shadow:0 24px 80px rgba(0,0,0,.42); }
.drawer-head { position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px; border-bottom:1px solid #2A2A2A; background:inherit; }
.drawer-head h2 { margin:0; font-size:20px; }
.drawer-head p { margin:3px 0 0; color:#8a8f99; font-size:12px; }
.drawer-head button { border:1px solid #444; border-radius:8px; background:#222; color:#fff; height:34px; padding:0 12px; cursor:pointer; }
.drawer-actions { position:relative; z-index:6; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.drawer-body { position:relative; z-index:1; min-height:0; display:grid; grid-template-rows:minmax(260px, 1fr) minmax(230px, 42%); gap:0; }
.drawer.fullscreen .drawer-body { grid-template-rows:minmax(0, 1fr) minmax(190px, 26%); }
.project-table { min-height:0; overflow:auto; padding:0 0 16px; border-bottom:1px solid #2A2A2A; }
.project-table .drawer-trend-table .project-sticky { padding-left:18px; }
.drawer.fullscreen .project-table { padding:0 0 18px; }
.drawer.fullscreen .project-table .drawer-trend-table .project-sticky { padding-left:22px; }
.linked-map-wrap { min-width:0; display:grid; grid-template-rows:auto 1fr; background:#151515; }
.linked-map-head { padding:13px 16px; border-bottom:1px solid #2A2A2A; display:flex; justify-content:space-between; gap:12px; align-items:center; }
.linked-map-head h3 { margin:0; font-size:15px; }
.linked-map-head span { color:#8a8f99; font-size:12px; }
#linkedMap { position:relative; min-height:0; height:100%; background:#f2efe9; }
#linkedMap .leaflet-control-attribution { display:none; }
#linkedMap .leaflet-control-zoom a { background:#fff; color:#222; border-color:#d1d5db; }
.linked-map-note { position:absolute; left:12px; right:12px; bottom:12px; z-index:500; padding:10px 12px; border-radius:8px; background:rgba(17,24,39,.82); color:#fff; font-size:12px; line-height:1.6; box-shadow:0 8px 24px rgba(0,0,0,.22); }
.linked-map-empty { height:100%; display:grid; place-items:center; padding:28px; text-align:center; color:#9ca3af; line-height:1.8; background:#1A1A1A; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { position:sticky; top:0; background:#1A1A1A; z-index:1; color:#8a8f99; font-weight:700; text-align:left; padding:13px 8px; border-bottom:1px solid #333; }
td { padding:13px 8px; border-bottom:1px solid #292929; color:#d5d5d5; }
tr { cursor:pointer; }
tr:hover td { background:#222; color:#fff; }
td.num, th.num { text-align:right; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
.trend-table { min-width:5030px; width:5030px; table-layout:fixed; }
.trend-table th { top:0; }
.trend-table .metric-head th { top:42px; }
.trend-table .month-head { text-align:center; color:#d8dde7; background:#202020; border-left:1px solid #333; }
.trend-table .project-sticky { position:sticky; left:0; z-index:3; min-width:210px; width:210px; background:#1A1A1A; }
.trend-table td.project-sticky { z-index:2; }
.trend-table tr:hover td.project-sticky { background:#222; }
.trend-table th, .trend-table td { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.trend-table td.num, .trend-table th.num { padding-left:10px; padding-right:10px; text-align:right; }
.trend-table .base-col { width:92px; }
.trend-table .status-col { width:82px; }
.trend-table .date-col { width:108px; }
.trend-table .suite-metric { width:82px; }
.trend-table .area-metric { width:106px; }
.trend-table .price-metric { width:92px; }
.trend-table .amount-metric { width:116px; }
.trend-table .zero { color:#5d6470; }
.trend-table .month-divider { border-left:1px solid #383838; }
.trend-table small { display:block; margin-top:4px; color:#777; font-size:11px; line-height:1.25; }

<div class="app">
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand"><i></i><h1>北京房地产板块投资分析平台</h1></div>
      <div class="topbar-meta">
        <div class="cutoff"><i>▣</i><span>数据截至：</span><b>2026年5月</b></div>
        <div class="view-switch"><button class="active" data-view="map">地图</button><button data-view="table">表格</button></div>
      </div>
    </div>
    <div class="filter-toolbar">
      <div class="search">
        <input id="searchInput" placeholder="搜索楼盘、板块或行政区" />
        <button id="searchButton" class="search-submit" type="button" aria-label="搜索"><span class="search-icon" aria-hidden="true"></span></button>
      </div>
      <div class="filters">
        <div class="seg multi-select" id="districtFilter"></div>
        <div class="seg multi-select" id="plateFilter"></div>
        <div class="seg multi-select" id="groupFilter"></div>
        <div class="seg multi-select" id="scopeFilter"></div>
        <div class="seg multi-select" id="periodFilter"></div>
        <button id="resetFilters" class="reset-filters" type="button">清空</button>
      </div>
    </div>
  </header>
  <main class="stage">
    <div class="map-card">
      <aside class="ranking-panel" id="rankingPanel">
        <div class="ranking-head">
          <div class="ranking-headline">
            <div><h2>项目去化排行 TOP10</h2><p id="rankingPeriod"></p></div>
          </div>
          <div class="ranking-metrics" aria-label="排行指标">
            <button type="button" class="active" data-ranking-metric="suites">套数</button>
            <button type="button" data-ranking-metric="amount">金额</button>
            <button type="button" data-ranking-metric="area">面积</button>
            <button type="button" data-ranking-metric="price">均价</button>
          </div>
        </div>
        <div class="ranking-body">
          <div class="ranking-columns"><span>排名</span><span>项目名称</span><span id="rankingMetricLabel">成交套数</span></div>
          <div id="rankingRows"></div>
        </div>
      </aside>
      <div class="map-surface" id="mapSurface">
        <div id="beijingMap" class="real-map"></div>
        <div class="abstract-layer" id="abstractLayer">
          <svg class="outline" viewBox="0 0 100 100"><path d="M 50,5 L 75,15 L 90,40 L 85,75 L 65,95 L 35,95 L 15,75 L 10,40 L 25,15 Z"/></svg>
          <div class="floating-hint">ⓘ 北京真实地图为底图，可缩放拖拽；点击板块查看楼盘明细</div>
          <div class="hover-card" id="hoverCard"></div>

          </div>
          <aside id="yearRail" class="year-rail"></aside>
        </div>
        <div id="mapTitleBanner" class="map-title-banner"></div>
        <div id="mapLegend" class="map-legend"></div>
      </div>
    </div>
    <div class="overview" id="overview"></div>

function renderRealMap(preserveViewport=false) {

  mainAreaLayer.clearLayers();
  mainPlateLayer.clearLayers();
  mainProjectLayer.clearLayers();
  mainProjectMarkers.clear();
  renderDistrictHighlight(preserveViewport);
  const rows = plateRows().filter(r => r.loc);
  const visibleLabels = visiblePlateLabelNames(rows);
  const bounds = [];
  rows.forEach(row => {
    const active = state.activePlate === row.plate;
    const color = "#f97316";
    const center = [row.loc.lat, row.loc.lng];
    bounds.push(center);
    L.circle(center, {
      radius: active ? 2400 : 1500,
      color: active ? "#fff" : color,
      weight: active ? 3 : 2,
      fillColor: color,
      fillOpacity: active ? .20 : .10,
      opacity: .86,
      className: "plate-area"
    }).addTo(mainAreaLayer).on("click", () => selectPlate(row));
    if (visibleLabels.has(row.plate)) {
      const marker = L.marker(center, { icon: makePlateLabelIcon(row, active), title: row.plate }).addTo(mainPlateLayer);
      marker.bindTooltip(`${row.plate}板块｜${row.projects.length}个项目｜${periodLabel()}成交${fmt.format(row.stats.suites)}套`, { direction:"top", offset:[0,-18], className:"plate-label" });
      marker.on("click", () => selectPlate(row));
    }
    if (active) {
      row.projects.forEach(p => {
        if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
        const projectMarker = L.marker([p.lat, p.lng], { icon: makeSquareIcon(p), title: p.project }).addTo(mainProjectLayer);
        projectMarker.bindTooltip(`${p.project}｜${p.coordConfidence || "待核验"}｜${p.matchedName || p.coordSource || "真实坐标"}｜${fmt.format(projectPeriod(p).suites)}套`, { direction:"top", className:"project-label" });
        projectMarker.on("click", () => openDetail(p));
        mainProjectMarkers.set(p.id, projectMarker);
      });
    }
  });
  if (bounds.length && !state.activePlate && !state.districts.length && !preserveViewport) {
    mainMap.fitBounds(L.latLngBounds(bounds).pad(.13), { paddingTopLeft:[70,110], paddingBottomRight:[70,76], maxZoom:10.4 });

  renderMapHud();
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[char]));
}

开发商：${p.summaryDeveloper || "暂未补充"}
${projectSummarySource(p)}`;
  const summary = `<h4>${escapeHtml(p.project)}</h4>
    <div class="project-summary-grid">
      <div class="project-summary-item"><span>住建委备案名</span><b>${escapeHtml(p.summaryRecordName || "暂未补充")}</b></div>
      <div class="project-summary-item"><span>预售证</span><b>${escapeHtml(p.summaryPresalePermit || "暂未补充")}</b></div>
      <div class="project-summary-item"><span>开发商</span><b>${escapeHtml(p.summaryDeveloper || "暂未补充")}</b></div>

function projectSummarySource(p) {
  const maySource = p.mayDataSource || "天朗";
  const validation = p.fangValidationConclusion
    ? `；房天下校验：${p.fangValidationConclusion}`
    : "";

function ensureProjectSummaryTooltip() {
  let tooltip = document.getElementById("projectSummaryTooltip");
  if (!tooltip) {
    tooltip = document.createElement("div");
    tooltip.id = "projectSummaryTooltip";
    tooltip.className = "project-summary-tooltip";
    document.body.appendChild(tooltip);
  }
  return tooltip;
}
function moveProjectSummary(event) {
  const tooltip = ensureProjectSummaryTooltip();
  const gap = 16;
  const width = Math.min(440, window.innerWidth - 24);
  const left = Math.min(window.innerWidth - width - 12, Math.max(12, event.clientX + gap));
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${Math.max(12, Math.min(window.innerHeight - tooltip.offsetHeight - 12, event.clientY + gap))}px`;
}

    html: `<span style="display:block;width:${size}px;height:${size}px;border-radius:999px;background:${color};border:2px solid #111;box-shadow:0 0 0 ${active ? 7 : 4}px rgba(249,115,22,${active ? .24 : .14}),0 10px 24px rgba(0,0,0,.45)"></span>`,

}

    document.getElementById("linkedMapTitle").textContent = `${row.plate}公开定位待补齐`;
    document.getElementById("linkedMapSub").textContent = `当前仅展示 Excel 真实去化数据，共 ${row.projects.length} 个项目`;
    mapEl.innerHTML = `<div class="linked-map-empty"><div><b style="display:block;color:#fff;font-size:18px;margin-bottom:8px">该板块暂无可靠公开坐标</b><span>不会绘制模拟点位；请补充真实板块中心或楼盘经纬度。</span></div></div>`;

  L.marker(center, { icon: makePlateLabelIcon(row, true), title: row.plate }).addTo(linkedMap)
    .bindTooltip(`${row.plate}板块｜公开板块中心点｜${row.projects.length}个项目`, { direction:"top", offset:[0,-18], className:"plate-label" });
  row.projects.forEach(p => {
    if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
    const marker = L.marker([p.lat, p.lng], { icon: makeProjectIcon(false), title: p.project }).addTo(linkedMap);
    marker.bindTooltip(`${p.project}｜${fmt.format(projectPeriod(p).suites)}套`, { direction:"top", className:"project-label" });
    marker.on("click", () => openDetail(p));

    : "已定位到公开板块中心点；楼盘精确坐标尚未公开核验，所以不绘制模拟楼盘点。";
  mapEl.appendChild(note);
  setTimeout(() => linkedMap.invalidateSize(), 60);
}
function focusLinkedProject(p) {
  if (!p || !linkedMap || !Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
  linkedMarkers.forEach(marker => marker.setIcon(makeProjectIcon(false)));
  const marker = linkedMarkers.get(p.id);
  if (marker) {
    marker.setIcon(makeProjectIcon(true));
    marker.openTooltip();
  }
  linkedMap.setView([p.lat, p.lng], 15, { animate:true });
}
function focusMainProject(p) {
  if (!p || !Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
  if (state.mapMode !== "real") enterRealMap();
  if (!mainMap) return;
  state.project = p.id;
  mainProjectMarkers.forEach(marker => marker.setIcon(makeMapIcon("", "project", false)));
  const marker = mainProjectMarkers.get(p.id);
  if (marker) {
    marker.setIcon(makeMapIcon("", "project", true));
    marker.openTooltip();
  }
  mainMap.flyTo([p.lat, p.lng], 15, { duration:.35 });
}
const projectTrendMetrics = {
  suites: { label:"成交套数", short:"套数", color:"#1a73e8" },
  amount: { label:"网签金额", short:"金额", color:"#f97316" },
  area: { label:"成交面积", short:"面积", color:"#8b5cf6" },
  price: { label:"成交均价", short:"均价", color:"#0f9d76" }
};
function projectTrendMonths(p) {
  if (hasMulti(state.periods)) {
    return selectedRealMonths()
      .filter(month => p.monthly?.[month])
      .sort((a, b) => {
        const aRank = monthRank(a);
        const bRank = monthRank(b);
        if (Number.isFinite(aRank) && Number.isFinite(bRank)) return aRank - bRank;
        if (Number.isFinite(aRank)) return 1;
        if (Number.isFinite(bRank)) return -1;
        return DATA.months.indexOf(a) - DATA.months.indexOf(b);
      });
  }
  const months = projectMonths(p);
  const firstDataIndex = months.findIndex(month => {
    const item = p.monthly[month] || {};
    return ["suites", "amount", "price", "area"].some(key => Number(item[key]) > 0);
  });
  return firstDataIndex < 0 ? [] : months.slice(firstDataIndex);
}
function trendValueText(value, metricKey) {
  const numeric = Number(value) || 0;
  if (metricKey === "amount") return Math.abs(numeric) >= 10000 ? `${fmt1.format(numeric / 10000)}亿` : `${fmt1.format(numeric)}万`;
  if (metricKey === "area") return Math.abs(numeric) >= 10000 ? `${fmt1.format(numeric / 10000)}万㎡` : `${fmt1.format(numeric)}㎡`;
  if (metricKey === "price") return `${fmt.format(numeric)}元/㎡`;
  return `${fmt.format(numeric)}套`;
}
function trendAxisText(value, metricKey) {
  const numeric = Number(value) || 0;
  if (metricKey === "amount" && Math.abs(numeric) >= 10000) return `${fmt1.format(numeric / 10000)}亿`;
  if (metricKey === "area" && Math.abs(numeric) >= 10000) return `${fmt1.format(numeric / 10000)}万`;
  return fmt1.format(numeric);
}
function trendMonthText(month) {
  return month.replace("年", "/").replace("月", "");
}
function projectMonthSource(p, month) {
  if (month === "26年5月") {
    const source = p.mayDataSource || "天朗";
    const label = source.includes("克而瑞") ? "克而瑞（5月优先信源）" : "天朗（5月补充信源）";
    return {
      label,
      note: p.maySourceNote || "",
      validation: p.fangValidationConclusion ? `房天下校验：${p.fangValidationConclusion}` : ""
    };
  }
  return { label:"天朗去化分析表", note:"", validation:"" };
}
function renderProjectTrend(p, metricKey="suites") {
  const target = document.getElementById("projectTrendChart");
  if (!target) return;
  const metric = projectTrendMetrics[metricKey] || projectTrendMetrics.suites;
  const months = projectTrendMonths(p);
  document.querySelectorAll("[data-project-trend-metric]").forEach(button => {
    button.classList.toggle("active", button.dataset.projectTrendMetric === metricKey);
  });
  if (!months.length) {
    target.innerHTML = `<div class="project-trend-empty">暂无可展示的月度成交数据</div>`;
    return;
  }
  const values = months.map(month => {
    const item = p.monthly[month] || {};
    if (metricKey === "price") {
      return Number(item.price) || (Number(item.area) ? Number(item.amount) * 10000 / Number(item.area) : 0);
    }
    return Number(item[metricKey]) || 0;
  });

  const width = Math.max(420, Math.round(target.clientWidth || 760));
  const height = 360;
  const margin = { left:72, right:34, top:58, bottom:58 };
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const baseline = margin.top + plotHeight;
  const rawMax = Math.max(...values, 0);
  const yMax = rawMax > 0 ? rawMax * 1.18 : 1;
  const xAt = index => months.length === 1 ? margin.left + plotWidth / 2 : margin.left + index * plotWidth / (months.length - 1);
  const yAt = value => margin.top + plotHeight - value / yMax * plotHeight;
  const points = values.map((value, index) => [xAt(index), yAt(value)]);
  const linePath = points.map(([x,y], index) => `${index ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const areaPath = `M${points[0][0].toFixed(1)},${baseline} ${points.map(([x,y]) => `L${x.toFixed(1)},${y.toFixed(1)}`).join(" ")} L${points[points.length - 1][0].toFixed(1)},${baseline} Z`;
  const gridLines = Array.from({length:5}, (_, index) => {
    const ratio = index / 4;
    const y = margin.top + plotHeight * ratio;
    const value = yMax * (1 - ratio);
    return `<line class="project-trend-grid" x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}"></line>
      <text class="project-trend-axis-label" x="${margin.left - 10}" y="${y + 4}" text-anchor="end">${trendAxisText(value, metricKey)}</text>`;
  }).join("");
  const labelStep = Math.max(1, Math.ceil(months.length / 6));
  const xLabels = months.map((month, index) => {
    if (index % labelStep && index !== months.length - 1) return "";
    return `<text class="project-trend-axis-label" x="${xAt(index)}" y="${height - 17}" text-anchor="middle">${trendMonthText(month)}</text>`;
  }).join("");
  const valueLabels = points.map(([x,y], index) => `<text class="project-trend-value" x="${x}" y="${Math.max(20, y - 13)}" text-anchor="middle">${trendValueText(values[index], metricKey)}</text>`).join("");
  const dots = points.map(([x,y], index) => `<circle class="project-trend-point" cx="${x}" cy="${y}" r="5" fill="${metric.color}"></circle><circle class="project-trend-hit" cx="${x}" cy="${y}" r="15" data-trend-index="${index}"></circle>`).join("");
  const gradientId = `projectTrendFill${String(p.id).replace(/\W/g, "")}${metricKey}`;
  target.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${p.project}${metric.label}月度趋势">
    <defs><linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${metric.color}" stop-opacity=".24"></stop><stop offset="100%" stop-color="${metric.color}" stop-opacity=".02"></stop></linearGradient></defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#${gradientId})"></path>
    <path class="project-trend-line" d="${linePath}" stroke="${metric.color}"></path>
    ${dots}${valueLabels}${xLabels}
  </svg><div class="project-trend-tooltip" id="projectTrendTooltip"></div>`;
  const tooltip = document.getElementById("projectTrendTooltip");
  target.querySelectorAll("[data-trend-index]").forEach(hit => {
    const showTooltip = event => {
      const index = Number(hit.dataset.trendIndex);
      const month = months[index];
      const item = p.monthly[month] || {};
      const price = Number(item.price) || (Number(item.area) ? Number(item.amount) * 10000 / Number(item.area) : 0);
      const source = projectMonthSource(p, month);
      tooltip.innerHTML = `<strong>${month}</strong>
        <div class="project-trend-tooltip-row"><span>成交套数</span><b>${trendValueText(item.suites, "suites")}</b></div>
        <div class="project-trend-tooltip-row"><span>网签金额</span><b>${trendValueText(item.amount, "amount")}</b></div>
        <div class="project-trend-tooltip-row"><span>成交面积</span><b>${trendValueText(item.area, "area")}</b></div>
        <div class="project-trend-tooltip-row"><span>成交均价</span><b>${trendValueText(price, "price")}</b></div>
        <div class="project-trend-tooltip-source"><b>数据来源：</b>${escapeHtml(source.label)}
          ${source.note ? `<br>${escapeHtml(source.note)}` : ""}
          ${source.validation ? `<br>${escapeHtml(source.validation)}` : ""}
        </div>`;
      const targetRect = target.getBoundingClientRect();
      const hitRect = hit.getBoundingClientRect();
      const desiredLeft = hitRect.left + hitRect.width / 2 - targetRect.left;
      const desiredTop = hitRect.top + hitRect.height / 2 - targetRect.top;
      tooltip.style.left = `${Math.max(96, Math.min(targetRect.width - 96, desiredLeft))}px`;
      tooltip.style.top = `${Math.max(105, desiredTop)}px`;
      tooltip.classList.add("show");
    };
    hit.addEventListener("mouseenter", showTooltip);
    hit.addEventListener("mousemove", showTooltip);
    hit.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
  });
}

    fillOpacity:.14,
    opacity:.9
  }).addTo(projectDetailMap);
  L.marker([p.lat, p.lng], { icon:makeProjectIcon(true), title:p.project })
    .addTo(projectDetailMap)
    .bindTooltip(`${p.project}｜${p.matchedName || p.address || "公开地图定位"}`, {
      permanent:true,
      direction:"top",
      offset:[0,-12],
      className:"project-label"
    });
  const note = document.createElement("div");
  note.className = "project-location-note";
  note.textContent = `坐标来源：${p.coordSource || "公开地图"}；匹配点：${p.matchedName || p.address || p.project}`;
  mapEl.appendChild(note);
  setTimeout(() => projectDetailMap?.invalidateSize(), 80);
}
function openDetail(p) {
  if (!p) return;
  state.project = p.id;
  state.activePlate = p.plate;
  renderMap();
  focusMainProject(p);
  focusLinkedProject(p);
  const s = projectPeriod(p);
  document.getElementById("detailTitle").textContent = p.project;
  const coordText = Number.isFinite(p.lat) && Number.isFinite(p.lng) ? ` · 坐标：${p.coordConfidence || "待核验"} / ${p.coordSource || "公开地图"} / ${p.matchedName || p.address || "POI"}` : "";
  document.getElementById("detailSub").textContent = `${p.district||"-"} · ${p.group} · ${p.plate} · ${p.status} · 出让时间 ${p.landDate||"-"}${coordText}`;
  document.getElementById("detailBody").innerHTML = projectDetailTable(p);
  renderProjectTrend(p);
  document.querySelectorAll("[data-project-trend-metric]").forEach(button => {
    button.onclick = () => renderProjectTrend(p, button.dataset.projectTrendMetric);
  });
  const detail = document.getElementById("detail");
  detail.classList.add("open");
  document.getElementById("expandDetail").textContent = detail.classList.contains("fullscreen") ? "退出全屏" : "全屏";
  syncDetailDocking();
  setTimeout(() => renderProjectDetailMap(p), 80);
}
function render() {
  const tableView = document.getElementById("tableView");
  tableView.classList.toggle("open", state.view === "table");
  renderFilterControls();
  renderRankingPanel();
  document.getElementById("drawer").classList.toggle("open", state.view === "map" && !!state.activePlate);
  renderYearRail();
  renderMap();
  renderOverview();
  renderTableView();
  if (state.view === "map" && state.activePlate) {
    const row=plateRows().find(r=>r.plate===state.activePlate);
    if(row) {
      openDrawer(row);
      shiftMainMapForDrawer(row, 12);
    }
  }
  syncDetailDocking();
  applyMapMode();
}
initFilters();
initMainMap();
render();
</script>
</body>
</html>
