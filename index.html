<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>北京房地产板块投资分析平台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root { --bg:#141414; --panel:#1A1A1A; --panel2:#222; --line:#333; --text:#E4E3E0; --muted:#8a8f99; --orange:#f97316; --orange2:#ea580c; }
* { box-sizing:border-box; }
body { margin:0; height:100vh; overflow:hidden; color:var(--text); background:#141414; font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
.app { height:100vh; display:grid; grid-template-rows:auto 1fr; background:#141414; }
.topbar { position:relative; min-height:56px; display:block; padding:0; border-bottom:1px solid #2A2A2A; background:#141414; box-shadow:0 10px 28px rgba(0,0,0,.32); z-index:20; }
.topbar-main { height:52px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 18px; }
.topbar-meta { display:flex; align-items:center; gap:10px; }
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand i { width:4px; height:26px; border-radius:99px; background:var(--orange); }
.brand h1 { margin:0; font-size:20px; font-weight:950; letter-spacing:0; white-space:nowrap; }
.filter-toolbar { min-height:56px; display:flex; align-items:center; gap:8px; padding:6px 18px; border-top:0; background:#181818; }
.filters { flex:1 1 auto; display:flex; align-items:center; justify-content:flex-start; gap:2px; min-width:0; flex-wrap:nowrap; overflow:visible; scrollbar-width:none; }
.toolbar-meta { flex:0 0 auto; margin-left:auto; }
.filters::-webkit-scrollbar { display:none; }
.seg { position:relative; flex:0 0 auto; display:flex; align-items:center; height:42px; background:transparent; overflow:visible; }
.seg button { height:42px; min-width:70px; border:0; border-radius:4px; color:#8f96a3; background:transparent; font-size:14px; font-weight:700; cursor:pointer; }
.seg button.active { background:var(--orange2); color:white; box-shadow:none; }
.filter-trigger { position:relative; flex:0 0 auto; height:42px; min-width:88px; max-width:150px; padding:0 28px 0 12px; border:0; background:transparent; color:#E4E3E0; font-size:14px; font-weight:800; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.filter-trigger::after { content:""; position:absolute; right:10px; top:50%; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-65%) rotate(45deg); opacity:.72; }
.multi-select.has-value .filter-trigger { color:#fff; background:#252525; }
.filter-menu { display:none; position:absolute; top:43px; left:0; z-index:3000; width:max(220px, 100%); max-height:310px; overflow:auto; padding:8px; border:1px solid #3a3a3a; border-radius:7px; background:#1A1A1A; box-shadow:0 18px 48px rgba(0,0,0,.38); }
.seg.open .filter-menu { display:block; }
.filter-option { display:flex; align-items:center; gap:8px; min-height:32px; padding:6px 8px; border-radius:7px; color:#e5e7eb; font-size:13px; font-weight:800; cursor:pointer; }
.filter-option:hover { background:#252525; }
.filter-option input { width:14px; height:14px; margin:0; accent-color:#f97316; }
.filter-empty { padding:10px; color:#8a8f99; font-size:12px; }
.reset-filters { flex:0 0 auto; height:42px; padding:0 12px; border:0; border-radius:4px; background:transparent; color:#8a8f99; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; }
.reset-filters:hover { border-color:#f97316; color:#fff; }
.search { width:min(340px, 28vw); height:42px; display:flex; align-items:stretch; flex:0 1 340px; padding:0; border:1px solid #333; border-radius:5px; background:#1E1E1E; color:#6f7683; overflow:hidden; }
.search input { flex:1; min-width:0; padding:0 13px; border:0; outline:0; background:transparent; color:#E4E3E0; font-size:14px; }
.search-submit { position:relative; flex:0 0 50px; width:50px; border:0; background:var(--orange2); cursor:pointer; }
.search-submit:hover { filter:brightness(.96); }
.search-icon { position:absolute; left:50%; top:50%; width:16px; height:16px; border:2px solid #fff; border-radius:50%; transform:translate(-58%,-58%); }
.search-icon::after { content:""; position:absolute; right:-6px; bottom:-4px; width:8px; height:2px; border-radius:2px; background:#fff; transform:rotate(45deg); transform-origin:left center; }
.cutoff { height:36px; display:flex; align-items:center; gap:8px; padding:0 12px; border:1px solid #333; border-radius:7px; background:#252525; color:#9ca3af; font-size:12px; font-weight:800; white-space:nowrap; }
.cutoff i { color:var(--orange); font-style:normal; }
.cutoff b { color:var(--orange); font-size:15px; letter-spacing:.2px; }
.view-switch { display:flex; height:34px; border:1px solid #333; border-radius:6px; background:#1E1E1E; overflow:hidden; }
.view-switch button { height:34px; min-width:60px; border:0; border-right:1px solid #333; background:transparent; color:#8f96a3; font-weight:800; cursor:pointer; }
.view-switch button:last-child { border-right:0; }
.view-switch button.active { background:var(--orange2); color:#fff; }
select { height:36px; border:1px solid #333; border-radius:7px; background:#1E1E1E; color:#E4E3E0; padding:0 10px; font-size:13px; font-weight:800; outline:none; }
.stage { position:relative; overflow:hidden; background:#e8e2d6; }
.stage::before { display:none; }
.map-card { position:absolute; inset:0; display:grid; grid-template-columns:minmax(0, 1fr); }
.ranking-panel { position:relative; z-index:4; min-width:0; display:grid; grid-template-rows:auto minmax(0, 1fr); border-right:1px solid #dadce0; background:#fff; color:#202124; box-shadow:4px 0 16px rgba(60,64,67,.15); overflow:hidden; }
.ranking-head { padding:22px 20px 18px; color:#fff; background:linear-gradient(135deg,#12356f 0%,#2457ad 52%,#356bd8 100%); }
.ranking-headline { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.ranking-head h2 { margin:0; font-size:23px; line-height:1.2; font-weight:950; letter-spacing:0; }
.ranking-head p { margin:8px 0 0; color:rgba(255,255,255,.88); font-size:13px; font-weight:700; }
.ranking-metrics { display:flex; margin-top:16px; width:100%; border:1px solid rgba(255,255,255,.62); border-radius:7px; overflow:hidden; }
.ranking-metrics button { flex:1 1 0; height:34px; min-width:0; padding:0 8px; border:0; border-right:1px solid rgba(255,255,255,.48); background:rgba(255,255,255,.08); color:#fff; font-size:13px; font-weight:900; cursor:pointer; }
.ranking-metrics button:last-child { border-right:0; }
.ranking-metrics button:hover { background:rgba(255,255,255,.18); }
.ranking-metrics button.active { background:#fff; color:#4f56bd; }
.ranking-body { min-height:0; overflow:auto; background:#fff; }
.ranking-columns,.ranking-row { display:grid; grid-template-columns:48px minmax(0,1fr) 118px; align-items:center; column-gap:8px; }
.ranking-columns { position:sticky; top:0; z-index:2; min-height:48px; padding:0 14px; border-bottom:1px solid #dfe4ed; background:#f5f7fb; color:#4b5563; font-size:12px; font-weight:900; }
.ranking-columns span:last-child { text-align:right; }
.ranking-row { min-height:66px; padding:9px 14px; border-bottom:1px solid #e7ebf2; background:#fff; cursor:pointer; transition:background .15s ease; }
.ranking-row:nth-child(odd) { background:#fafbfc; }
.ranking-row:hover { background:#eef4ff; }
.ranking-row.active { background:var(--brand-blue-soft); box-shadow:inset 4px 0 0 var(--brand-blue); }
.ranking-rank { width:34px; height:34px; display:grid; place-items:center; color:#6b7280; font-size:17px; font-weight:950; }
.ranking-row.top-1 .ranking-rank,.ranking-row.top-2 .ranking-rank,.ranking-row.top-3 .ranking-rank { color:#fff; clip-path:polygon(0 0,100% 0,82% 100%,0 100%); }
.ranking-row.top-1 .ranking-rank { background:#ff4e6a; }
.ranking-row.top-2 .ranking-rank { background:#ff9500; }
.ranking-row.top-3 .ranking-rank { background:#ffb51b; }
.ranking-project { min-width:0; }
.ranking-project strong { display:block; overflow:hidden; color:#202124; font-size:14px; font-weight:900; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
.ranking-project span { display:block; margin-top:4px; overflow:hidden; color:#7b8491; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
.ranking-value { min-width:0; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:3px; color:#202124; text-align:right; white-space:nowrap; }
.ranking-value b { font-size:14px; font-weight:950; line-height:1.2; }
.ranking-value small { color:#7b8491; font-size:11px; font-weight:750; line-height:1.2; }
.ranking-empty { min-height:220px; display:grid; place-items:center; padding:28px; color:#7b8491; font-size:13px; text-align:center; }
.map-surface { position:relative; width:100%; height:100%; border:0; border-radius:0; background:#e8e2d6; box-shadow:none; overflow:hidden; }
.map-surface::after { content:""; position:absolute; inset:0; background:transparent; pointer-events:none; z-index:3; }
.map-surface.real-mode::after { opacity:0; }
.abstract-layer { display:none; }
.real-map { position:absolute; inset:0; z-index:1; opacity:1; pointer-events:auto; transition:opacity .32s ease; background:#e8e2d6; }
.map-surface.real-mode .real-map { opacity:1; pointer-events:auto; }
.map-surface.real-mode .abstract-layer { opacity:1; pointer-events:none; transform:none; }
.leaflet-container { background:#f2efe9; font-family:inherit; }
.leaflet-control-zoom a { background:#fff; color:#222; border-color:#d1d5db; }
.leaflet-control-attribution { display:none; }
.map-control-bar { position:absolute; left:18px; bottom:24px; z-index:10; display:flex; align-items:flex-end; gap:10px; max-width:calc(100vw - 36px); pointer-events:none; }
.map-control-stack { display:flex; flex-direction:column; overflow:hidden; border:1px solid rgba(17,24,39,.15); border-radius:8px; background:rgba(255,255,255,.94); box-shadow:0 6px 18px rgba(0,0,0,.16); backdrop-filter:blur(10px); pointer-events:auto; }
.map-zoom-dock { display:flex; flex-direction:column; }
.map-control-stack button { width:38px; height:38px; border:0; border-bottom:1px solid rgba(17,24,39,.12); background:transparent; color:#111827; font-size:20px; font-weight:900; line-height:1; cursor:pointer; display:grid; place-items:center; }
.map-control-stack button:last-child { border-bottom:0; }
.map-control-stack button:hover { background:#f97316; color:#fff; }
.map-control-stack button.active { background:#fff7ed; color:#ea580c; }
.map-icon-btn { font-size:17px; }
.map-icon-btn.info-icon { font-family:Georgia,serif; font-size:18px; font-weight:900; }
.plate-marker { display:grid; place-items:center; border-radius:999px; background:#f97316; color:#fff; font-weight:950; font-size:12px; border:2px solid #fff; box-shadow:0 6px 18px rgba(0,0,0,.22),0 0 0 4px rgba(249,115,22,.18); white-space:nowrap; }
.plate-marker.active { background:#e11d48; box-shadow:0 8px 22px rgba(0,0,0,.26),0 0 0 5px rgba(225,29,72,.18); }
.plate-label-marker { height:32px; display:inline-flex; align-items:center; gap:7px; padding:0 10px; border:2px solid #f97316; border-radius:999px; background:rgba(255,255,255,.94); color:#1f2937; box-shadow:0 8px 22px rgba(0,0,0,.20),0 0 0 4px rgba(249,115,22,.14); white-space:nowrap; }
.plate-label-marker strong { font-size:13px; line-height:1; font-weight:950; }
.plate-label-marker em { min-width:28px; padding:3px 6px; border-radius:999px; background:#f97316; color:#fff; font-style:normal; font-size:11px; font-weight:950; text-align:center; }
.plate-label-marker.active { border-color:#e11d48; box-shadow:0 10px 26px rgba(0,0,0,.25),0 0 0 5px rgba(225,29,72,.16); transform:scale(1.04); }
.plate-label-marker.active em { background:#e11d48; }
.project-marker { display:grid; place-items:center; border-radius:999px; background:#111827; border:2px solid #fff; box-shadow:0 5px 14px rgba(0,0,0,.28); }
.project-marker.active { background:#f97316; box-shadow:0 7px 18px rgba(0,0,0,.32),0 0 0 5px rgba(249,115,22,.22); }
.project-square { display:block; width:14px; height:14px; border:1px solid rgba(255,255,255,.86); box-shadow:0 4px 10px rgba(0,0,0,.24); }
.project-coordinate-marker { min-height:38px; display:flex; align-items:center; gap:6px; white-space:nowrap; pointer-events:auto; }
.project-coordinate-marker i { flex:0 0 14px; width:14px; height:14px; border:3px solid #fff; border-radius:999px; background:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,.22),0 4px 12px rgba(0,0,0,.30); }
.project-coordinate-marker span { max-width:288px; overflow:hidden; display:grid; gap:3px; padding:6px 9px; border:1px solid rgba(249,115,22,.42); border-radius:7px; background:rgba(255,255,255,.96); color:#202124; box-shadow:0 4px 14px rgba(60,64,67,.20); font-size:12px; font-weight:900; text-overflow:ellipsis; }
.project-coordinate-marker b { display:block; overflow:hidden; font-size:12px; line-height:1.15; text-overflow:ellipsis; white-space:nowrap; }
.project-coordinate-marker small { display:flex; flex-wrap:wrap; gap:4px 7px; color:#5f6b7a; font-size:10px; font-weight:850; line-height:1.15; }
.project-coordinate-marker em { color:#f97316; font-style:normal; font-size:10px; white-space:nowrap; }
.project-coordinate-marker.active { min-height:30px; }
.project-coordinate-marker.active i { width:18px; height:18px; flex-basis:18px; background:#f97316; box-shadow:0 0 0 5px rgba(249,115,22,.22),0 6px 16px rgba(0,0,0,.30); }
.project-coordinate-marker.active span { border-color:var(--brand-blue); background:var(--brand-blue); color:#fff; box-shadow:0 6px 18px rgba(53,107,216,.30); }
.project-coordinate-marker.active small { color:rgba(255,255,255,.86); }
.project-coordinate-marker.active em { color:#fff; }
.map-title-banner { position:absolute; left:50%; top:94px; transform:translateX(-50%); z-index:8; padding:8px 18px; border-radius:4px; background:#059b9b; color:white; font-size:18px; font-weight:950; box-shadow:0 10px 24px rgba(0,0,0,.20); pointer-events:none; }
.map-legend { display:none; position:absolute; left:70px; bottom:24px; z-index:9; width:min(360px, calc(100vw - 100px)); padding:10px 12px; border:1px solid rgba(14,165,163,.55); border-radius:8px; background:rgba(255,255,255,.94); color:#333; box-shadow:0 8px 22px rgba(0,0,0,.16); font-size:13px; backdrop-filter:blur(10px); }
.map-legend.open { display:block; }
.map-legend h3 { margin:0 0 8px; font-size:16px; }
.map-legend p { margin:0 0 8px; color:#5b616b; font-size:12px; line-height:1.45; }
.map-legend p:last-child { margin-bottom:0; }
.map-legend span { display:flex; align-items:center; gap:8px; margin:5px 0; }
.map-legend i { width:24px; height:18px; display:inline-block; }
.year-rail { min-width:0; max-width:min(520px, calc(100vw - 88px)); height:38px; display:flex; align-items:center; gap:5px; padding:4px; border:1px solid rgba(17,24,39,.15); border-radius:8px; background:rgba(255,255,255,.94); box-shadow:0 6px 18px rgba(0,0,0,.16); backdrop-filter:blur(10px); color:#374151; overflow-x:auto; scrollbar-width:none; pointer-events:auto; }
.year-rail::-webkit-scrollbar { display:none; }
.year-rail h3 { flex:0 0 auto; margin:0 4px 0 6px; font-size:12px; font-weight:950; color:#0f172a; white-space:nowrap; }
.year-rail button { flex:0 0 auto; min-width:52px; height:30px; margin:0; border:0; border-radius:7px; background:transparent; color:#6b7280; font-size:13px; font-weight:900; cursor:pointer; }
.year-rail button:hover { background:rgba(15,23,42,.08); color:#111827; }
.year-rail button.active { background:#f97316; color:#fff; box-shadow:0 4px 12px rgba(249,115,22,.24); }
.leaflet-tooltip.plate-label { background:rgba(255,255,255,.94); color:#111827; border:1px solid rgba(17,24,39,.12); border-radius:5px; padding:4px 8px; box-shadow:0 8px 20px rgba(0,0,0,.18); font-size:12px; font-weight:900; }
.leaflet-tooltip.project-label { max-width:320px; background:rgba(17,24,39,.94); color:#fff; border:0; border-radius:5px; padding:6px 9px; font-size:12px; font-weight:800; line-height:1.35; }
.leaflet-tooltip.plate-project-tooltip { width:340px; max-width:min(340px, calc(100vw - 32px)); padding:0; border:1px solid rgba(37,99,235,.18); border-radius:10px; background:rgba(255,255,255,.98); color:#202124; box-shadow:0 12px 32px rgba(60,64,67,.26); overflow:hidden; }
.amap-tooltip.project-label { max-width:320px; background:rgba(17,24,39,.94); color:#fff; border:0; border-radius:5px; padding:6px 9px; font-size:12px; font-weight:800; line-height:1.35; box-shadow:0 8px 20px rgba(0,0,0,.18); }
.leaflet-tooltip.project-label strong, .amap-tooltip.project-label strong { display:block; margin-bottom:2px; font-size:12px; font-weight:950; }
.leaflet-tooltip.project-label span, .amap-tooltip.project-label span { display:block; color:rgba(255,255,255,.86); font-size:11px; font-weight:800; white-space:normal; }
.amap-tooltip.plate-project-tooltip { width:340px; max-width:min(340px, calc(100vw - 32px)); padding:0; border:1px solid rgba(37,99,235,.18); border-radius:10px; background:rgba(255,255,255,.98); color:#202124; box-shadow:0 12px 32px rgba(60,64,67,.26); overflow:hidden; }
.plate-project-tip { padding:12px 13px; }
.plate-project-tip h3 { margin:0; display:flex; align-items:center; justify-content:space-between; gap:10px; color:#111827; font-size:15px; font-weight:950; }
.plate-project-tip h3 span { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plate-project-tip h3 em { flex:0 0 auto; padding:3px 7px; border-radius:999px; background:var(--brand-blue-soft); color:var(--brand-blue); font-style:normal; font-size:11px; font-weight:950; }
.plate-project-tip p { margin:4px 0 9px; color:#6b7280; font-size:11px; font-weight:700; line-height:1.45; }
.plate-project-tip ul { list-style:none; margin:0; padding:0; display:grid; gap:7px; }
.plate-project-tip li { min-width:0; display:grid; grid-template-columns:minmax(0,1fr) 52px; gap:10px; align-items:center; padding:7px 8px; border-radius:8px; background:#f8fafc; }
.plate-project-tip li > span { min-width:0; display:grid; gap:2px; }
.plate-project-tip strong { display:block; overflow:hidden; color:#202124; font-size:12px; font-weight:950; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
.plate-project-tip small { display:block; overflow:hidden; color:#6b7280; font-size:10px; font-weight:750; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
.plate-project-tip b { justify-self:end; color:var(--brand-blue); font-size:12px; font-weight:950; white-space:nowrap; }
.plate-project-tip .more { display:block; margin-top:8px; color:#6b7280; font-size:11px; font-weight:800; text-align:center; }
.leaflet-tooltip.district-project-tooltip { width:430px; max-width:min(430px, calc(100vw - 32px)); padding:0; border:1px solid rgba(37,99,235,.18); border-radius:10px; background:rgba(255,255,255,.98); color:#202124; box-shadow:0 12px 32px rgba(60,64,67,.26); overflow:hidden; }
.amap-tooltip.district-project-tooltip { width:430px; max-width:min(430px, calc(100vw - 32px)); padding:0; border:1px solid rgba(37,99,235,.18); border-radius:10px; background:rgba(255,255,255,.98); color:#202124; box-shadow:0 12px 32px rgba(60,64,67,.26); overflow:hidden; }
.district-project-tip { padding:12px 13px; }
.district-project-tip h3 { margin:0; display:flex; align-items:center; justify-content:space-between; gap:10px; color:#111827; font-size:15px; font-weight:950; }
.district-project-tip h3 span { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.district-project-tip h3 em { flex:0 0 auto; padding:3px 7px; border-radius:999px; background:var(--brand-blue-soft); color:var(--brand-blue); font-style:normal; font-size:11px; font-weight:950; }
.district-project-tip p { margin:4px 0 9px; color:#6b7280; font-size:11px; font-weight:700; line-height:1.45; }
.district-project-tip ul { list-style:none; margin:0; padding:0; display:grid; gap:7px; max-height:360px; overflow:auto; }
.district-project-tip li { padding:7px 8px; border-radius:8px; background:#f8fafc; }
.district-project-tip strong { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#202124; font-size:12px; font-weight:950; }
.district-project-tip strong b { color:var(--brand-blue); font-size:12px; white-space:nowrap; }
.district-project-tip small { display:block; margin-top:4px; color:#6b7280; font-size:10px; font-weight:750; line-height:1.45; white-space:normal; overflow:visible; }
.district-project-tip .more { display:block; margin-top:8px; color:#6b7280; font-size:11px; font-weight:800; text-align:center; }
.district-name-label { display:inline-flex; align-items:center; justify-content:center; min-width:74px; height:28px; gap:6px; padding:0 9px; border:1px solid rgba(37,99,235,.32); border-radius:999px; background:rgba(255,255,255,.9); color:#1f2937; box-shadow:0 4px 12px rgba(15,23,42,.14); font-size:12px; font-weight:950; line-height:1; white-space:nowrap; pointer-events:auto; cursor:pointer; }
.district-name-label em { padding:3px 6px; border-radius:999px; background:var(--brand-blue); color:#fff; font-style:normal; font-size:11px; font-weight:950; }
.leaflet-tooltip::before { display:none; }
.leaflet-interactive.plate-area { filter:drop-shadow(0 0 10px rgba(249,115,22,.30)); }
.outline { display:none; }

function renderProjectTrend(p, metricKey="suites") {

    }

  });

  const plotHeight = height - margin.top - margin.bottom;
  const baseline = margin.top + plotHeight;
  const rawMax = Math.max(...values, 0);
  const yMax = rawMax > 0 ? rawMax * 1.18 : 1;
  const xAt = index => months.length === 1 ? margin.left + plotWidth / 2 : margin.left + index * plotWidth / (months.length - 1);

    const y = margin.top + plotHeight * ratio;

  }).join("");
  const labelStep = Math.max(1, Math.ceil(months.length / 6));
  const xLabels = months.map((month, index) => {
    if (index % labelStep && index !== months.length - 1) return "";

  }).join("");
  const valueLabels = points.map(([x,y], index) => `<text class="project-trend-value" x="${x}" y="${Math.max(20, y - 13)}" text-anchor="middle">${trendValueText(values[index], metricKey)}</text>`).join("");
  const dots = points.map(([x,y], index) => `<circle class="project-trend-point" cx="${x}" cy="${y}" r="5" fill="${metric.color}"></circle><circle class="project-trend-hit" cx="${x}" cy="${y}" r="15" data-trend-index="${index}"></circle>`).join("");
  const gradientId = `projectTrendFill${String(p.id).replace(/\W/g, "")}${metricKey}`;
  target.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${p.project}${metric.label}月度趋势">
    <defs><linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${metric.color}" stop-opacity=".24"></stop><stop offset="100%" stop-color="${metric.color}" stop-opacity=".02"></stop></linearGradient></defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#${gradientId})"></path>
    <path class="project-trend-line" d="${linePath}" stroke="${metric.color}"></path>
    ${dots}${valueLabels}${xLabels}
  </svg><div class="project-trend-tooltip" id="projectTrendTooltip"></div>`;
  const tooltip = document.getElementById("projectTrendTooltip");
  target.querySelectorAll("[data-trend-index]").forEach(hit => {
    const showTooltip = event => {
      const index = Number(hit.dataset.trendIndex);
      const month = months[index];
      const item = p.monthly[month] || {};
      const price = Number(item.price) || (Number(item.area) ? Number(item.amount) * 10000 / Number(item.area) : 0);
      const source = projectMonthSource(p, month);

        <div class="project-trend-tooltip-row"><span>成交面积</span><b>${trendValueText(item.area, "area")}</b></div>
        <div class="project-trend-tooltip-row"><span>成交均价</span><b>${trendValueText(price, "price")}</b></div>
        <div class="project-trend-tooltip-source"><b>数据来源：</b>${escapeHtml(source.label)}</div>`;
      const targetRect = target.getBoundingClientRect();
      const hitRect = hit.getBoundingClientRect();
      const desiredLeft = hitRect.left + hitRect.width / 2 - targetRect.left;
      const desiredTop = hitRect.top + hitRect.height / 2 - targetRect.top;
      const tooltipWidth = Math.max(232, tooltip.offsetWidth || 232);
      const edgePadding = 24;
      tooltip.classList.remove("is-left", "is-right");
      if (desiredLeft + tooltipWidth / 2 > targetRect.width - edgePadding) {
        tooltip.classList.add("is-left");
        tooltip.style.left = `${Math.max(tooltipWidth + edgePadding, desiredLeft)}px`;
        tooltip.style.top = `${Math.max(120, Math.min(targetRect.height - 42, desiredTop))}px`;
      } else if (desiredLeft - tooltipWidth / 2 < edgePadding) {
        tooltip.classList.add("is-right");
        tooltip.style.left = `${Math.min(targetRect.width - tooltipWidth - edgePadding, desiredLeft)}px`;
        tooltip.style.top = `${Math.max(120, Math.min(targetRect.height - 42, desiredTop))}px`;
      } else {

        tooltip.style.top = `${Math.max(145, desiredTop)}px`;
      }
      tooltip.classList.add("show");
    };
    hit.addEventListener("mouseenter", showTooltip);
    hit.addEventListener("mousemove", showTooltip);
    hit.addEventListener("click", event => {
      event.stopPropagation();
      const month = months[Number(hit.dataset.trendIndex)];
      updateTransactionSectionForMonth(p, month, { scroll:true });
      showTooltip(event);
    });
    hit.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
  });
}
function similarPriceProjects(p) {
  const currentStats = projectPeriod(p);
  if (!currentStats.price) return [];
  return scopedProjects()
    .filter(project => String(project.id) !== String(p.id))
    .map(project => {
      const stats = projectPeriod(project);
      const difference = stats.price ? (stats.price - currentStats.price) / currentStats.price * 100 : 0;
      return { project, stats, difference };
    })
    .filter(item => item.stats.price > 0)
    .sort((a, b) => Math.abs(a.difference) - Math.abs(b.difference) || b.stats.suites - a.stats.suites)
    .slice(0, 6);
}

    showBuildingBlock:true,
    buildingAnimation:false
  });
  projectDetailMap.add(new AMap.Circle({
    center:point,
    radius:180,
    strokeColor:"#f97316",
    strokeWeight:2,
    strokeOpacity:.9,
    fillColor:"#f97316",
    fillOpacity:.14,
    zIndex:60
  }));
  projectDetailMap.add(new AMap.Marker({
    position:point,
    content:projectMapIconHtml(true),
    offset:new AMap.Pixel(-10, -10),
    title:p.project,
    zIndex:120
  }));
  const note = document.createElement("div");
  note.className = "project-location-note";
  note.textContent = `坐标来源：${p.coordSource || "公开地图"}；匹配点：${p.matchedName || p.address || p.project}`;
  mapEl.appendChild(note);
  setTimeout(() => resizeMapInstance(projectDetailMap), 80);
}
function renderProjectDetailMapLeaflet(p, mapEl) {
  mapEl.innerHTML = "";
  projectDetailMap = L.map(mapEl, {
    zoomControl:true,
    attributionControl:false,
    preferCanvas:true,
    fadeAnimation:false,
    zoomAnimation:false,
    markerZoomAnimation:false,
    minZoom:10
  }).setView([p.lat, p.lng], 16);
  L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}", {
    subdomains:["1", "2", "3", "4"],
    minZoom:3,
    maxZoom:18,
    updateWhenIdle:true,
    keepBuffer:4,
    crossOrigin:false
  }).addTo(projectDetailMap);
  restrictToBeijing(projectDetailMap);
  addBeijingBoundary(projectDetailMap);
  L.circle([p.lat, p.lng], {
    radius:180,
    color:"#f97316",
    weight:2,
    fillColor:"#f97316",
    fillOpacity:.14,
    opacity:.9
  }).addTo(projectDetailMap);
  L.marker([p.lat, p.lng], { icon:makeProjectIcon(true), title:p.project }).addTo(projectDetailMap);
  const note = document.createElement("div");
  note.className = "project-location-note";
  note.textContent = `坐标来源：${p.coordSource || "公开地图"}；匹配点：${p.matchedName || p.address || p.project}`;
  mapEl.appendChild(note);
  setTimeout(() => resizeMapInstance(projectDetailMap), 80);
}
function openDetail(p, options={}) {
  if (!p) return;
  state.project = p.id;
  state.activePlate = p.plate;
  state.detailTransactionMonth = options.transactionMonth || defaultTransactionMonthForProject(p);
  renderRankingPanel();
  renderMap();
  const s = projectPeriod(p);
  document.getElementById("detailTitle").textContent = p.project;
  const coordText = Number.isFinite(p.lat) && Number.isFinite(p.lng) ? ` · 坐标：${p.coordConfidence || "待核验"} / ${p.coordSource || "公开地图"} / ${p.matchedName || p.address || "POI"}` : "";
  document.getElementById("detailSub").textContent = `${p.district||"-"} · ${p.group} · ${p.plate} · ${p.status} · 拿地时间 ${p.landDate||"-"} · 最早取证时间 ${projectIssueDateText(p)}${coordText}`;
  document.getElementById("detailBody").innerHTML = projectDetailTable(p);
  renderProjectTrend(p);
  const similarToggle = document.getElementById("similarProjectsToggle");
  const similarSection = document.getElementById("similarProjectsSection");
  similarToggle.classList.remove("active");
  similarToggle.textContent = "同价位楼盘对比";
  similarToggle.disabled = !projectPeriod(p).price;
  similarToggle.onclick = () => {
    const open = similarSection.classList.toggle("open");
    similarToggle.classList.toggle("active", open);
    similarToggle.textContent = open ? "收起对比" : "同价位楼盘对比";
    if (open) {
      document.getElementById("detailBody").scrollTo({ top:0, behavior:"smooth" });
    }
  };
  document.querySelectorAll("[data-similar-project]").forEach(button => {
    button.onclick = () => {
      const project = findProjectById(button.dataset.similarProject);
      if (project) openDetail(project);
    };
  });
  document.querySelectorAll("[data-project-trend-metric]").forEach(button => {
    button.onclick = () => renderProjectTrend(p, button.dataset.projectTrendMetric);
  });
  const detail = document.getElementById("detail");
  detail.classList.add("open");
  document.getElementById("expandDetail").textContent = detail.classList.contains("fullscreen") ? "退出全屏" : "全屏";
  syncDetailDocking();
  resizeMainMapSoon();
  setTimeout(() => {
    focusMainProject(p);
    focusLinkedProject(p);
  }, 90);
  if (options.scrollToTransactions) {
    setTimeout(() => {
      const body = document.getElementById("detailBody");
      const section = document.getElementById("mayTransactionSection");
      if (body && section) body.scrollTo({ top:Math.max(0, section.offsetTop - 10), behavior:"smooth" });
    }, 80);
  }
  setTimeout(() => renderProjectDetailMap(p), 80);
}
function render() {
  const tableView = document.getElementById("tableView");
  tableView.classList.toggle("open", state.view === "table");
  renderFilterControls();
  renderRankingPanel();
  closePlateDrawer();
  renderYearRail();
  renderMap();
  renderOverview();
  renderTableView();
  syncDetailDocking();
  applyMapMode();
}
initFilters();
const mainMapInit = initMainMap();
render();
if (mainMapInit?.then) {
  mainMapInit.then(() => {
    renderRealMap(true);
    applyMapMode();
  });
}
</script>
</body>
</html>
