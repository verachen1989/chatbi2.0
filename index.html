<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chatbi2.0 Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(198, 235, 213, 0.45), transparent 28%),
        linear-gradient(180deg, #f7fbf8 0%, #ffffff 24%, #ffffff 100%);
      color: #2b2f36;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 248px;
      padding: 20px 14px;
      background: linear-gradient(180deg, #f9fcfa 0%, #ffffff 100%);
      border-right: 1px solid #edf1ef;
    }

    .brand {
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #dcefe2, #f2f9f4);
      margin-bottom: 18px;
    }

    .new-chat {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #1f7a4f;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item {
      padding: 12px 14px;
      border-radius: 10px;
      color: #4b5563;
      background: transparent;
      font-size: 15px;
    }

    .menu-item.active {
      background: #f4f7f5;
      color: #1f2937;
      font-weight: 600;
    }

    .main {
      flex: 1;
      position: relative;
      padding: 28px 36px 36px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #2d3748;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .header-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffcc68, #f59e0b);
    }

    .chat-shell {
      max-width: 1320px;
      margin: 0 auto;
      min-height: calc(100vh - 120px);
      position: relative;
    }

    .chat-shell.landing {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .landing-hero {
      max-width: 900px;
      text-align: center;
    }

    .landing-hero.hidden {
      display: none;
    }

    .landing-title {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 600;
      color: #1f7a4f;
      margin-bottom: 18px;
    }

    .landing-title strong {
      color: #1f7a4f;
    }

    .landing-bot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef8f1;
      box-shadow: inset 0 0 0 1px #d7efde;
      font-size: 24px;
    }

    .landing-subtitle {
      font-size: 15px;
      line-height: 1.9;
      color: #6b7280;
    }

    .user-row {
      display: flex;
      justify-content: flex-end;
      margin: 22px 16px 28px;
    }

    .user-row.hidden {
      display: none;
    }

    .user-bubble {
      max-width: 460px;
      background: #f1f3f6;
      color: #2d3748;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.7;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
    }

    .agent-block {
      width: 620px;
      margin-left: 220px;
      margin-top: 36px;
    }

    .agent-block.hidden {
      display: none;
    }

    .agent-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .agent-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: #eef8f1;
      box-shadow: inset 0 0 0 1px #d7efde;
    }

    .agent-status-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
    }

    .agent-status {
      font-size: 18px;
      color: #4b5563;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: 0.25;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    .event-stream {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .thought-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f8fafb;
      border: 1px solid #e9eef2;
      color: #6b7280;
      font-size: 13px;
    }

    .thought-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef3f6;
      color: #64748b;
      font-size: 11px;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      margin-left: 2px;
      color: #9aa4b2;
      animation: blinkCursor 1s infinite;
    }

    @keyframes blinkCursor {
      0%, 45% {
        opacity: 1;
      }
      46%, 100% {
        opacity: 0;
      }
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #65b784;
      box-shadow: 0 0 0 4px rgba(101, 183, 132, 0.12);
    }

    .result-card {
      margin-top: 4px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e8edf2;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    .result-card.hidden {
      display: none;
    }

    .result-head {
      padding: 18px 20px 8px;
    }

    .result-title {
      display: none;
    }

    .result-summary {
      font-size: 15px;
      line-height: 1.9;
      color: #2f3541;
      white-space: pre-wrap;
    }

    .result-summary.loading {
      min-height: 64px;
    }

    .answer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0 0;
    }

    .answer-action {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .answer-action svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .answer-action:hover {
      color: #475569;
      background: #f8fafc;
    }

    .answer-action.active {
      color: #1f7a4f;
      background: #eefaf2;
      border-color: #d9ece0;
    }

    .answer-action.copy-action {
      width: 30px;
      padding: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 0 20px 18px;
    }

    .metric-card {
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fbfcfd, #f6f9fb);
      border: 1px solid #edf1f5;
    }

    .metric-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 24px;
      line-height: 1;
      color: #111827;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .metric-trend {
      font-size: 12px;
      color: #1f7a4f;
    }

    .highlight-list {
      padding: 0 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .highlight-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.8;
    }

    .highlight-bullet {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7fc69a;
      margin-top: 9px;
      flex: none;
    }

    .table-card {
      margin: 0 20px 20px;
      border: 1px solid #e8edf2;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      display: none;
    }

    .table-card.show {
      display: block;
      animation: fadeUp 0.32s ease;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: #fbfcfd;
      border-bottom: 1px solid #edf1f5;
    }

    .table-title {
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
    }

    .table-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #d8e0e8;
      background: #fff;
      color: #475569;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: #9ed1b1;
      color: #1f7a4f;
      background: #f6fcf8;
    }

    .action-btn.success {
      border-color: #b9e3c7;
      color: #1f7a4f;
      background: #eefaf2;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      color: #374151;
    }

    .result-table th,
    .result-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #eef2f5;
      text-align: left;
      white-space: nowrap;
    }

    .result-table th {
      background: #fcfdfd;
      color: #64748b;
      font-weight: 600;
    }

    .download-menu {
      position: relative;
    }

    .download-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 128px;
      padding: 6px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e5ebf0;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.10);
      display: none;
      z-index: 5;
    }

    .download-panel.show {
      display: block;
      animation: fadeUp 0.2s ease;
    }

    .download-item {
      width: 100%;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      padding: 0 10px;
      color: #374151;
      cursor: pointer;
    }

    .download-item:hover {
      background: #f6f8fa;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: #f3f6f8;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), transparent);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .summary-skeleton-line {
      height: 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .summary-skeleton-line:last-child {
      width: 68%;
      margin-bottom: 0;
    }

    .metric-card.loading {
      min-height: 88px;
    }

    .metric-card.loading .metric-label,
    .metric-card.loading .metric-value,
    .metric-card.loading .metric-trend {
      height: 12px;
      border-radius: 999px;
      color: transparent;
      background: #eef2f5;
    }

    .metric-card.loading .metric-value {
      height: 22px;
      width: 62%;
      margin-bottom: 10px;
    }

    .metric-card.loading .metric-label {
      width: 48%;
      margin-bottom: 12px;
    }

    .metric-card.loading .metric-trend {
      width: 56%;
    }

    .highlight-item.loading {
      align-items: center;
    }

    .highlight-item.loading .highlight-bullet {
      background: #d8e7dd;
      margin-top: 0;
    }

    .highlight-line {
      height: 12px;
      border-radius: 999px;
      flex: 1;
      background: #eef2f5;
    }

    .fade-in {
      animation: fadeUp 0.32s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .process-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .process-card {
      opacity: 0;
      transform: translateY(12px);
      background: #f5f7fa;
      border: 1px solid #e8edf2;
      border-radius: 12px;
      padding: 14px 16px;
      transition: all 0.38s ease;
      cursor: pointer;
    }

    .process-card.skill-card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 250, 252, 0.96)) padding-box,
        linear-gradient(135deg, rgba(79, 172, 254, 0.42), rgba(0, 242, 254, 0.36), rgba(121, 40, 202, 0.34)) border-box;
      border: 1px solid transparent;
      box-shadow: 0 10px 24px rgba(79, 172, 254, 0.10);
    }

    .process-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .process-title {
      font-size: 15px;
      color: #111827;
      font-weight: 600;
      margin-bottom: 0;
    }

    .process-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .process-desc {
      font-size: 13px;
      line-height: 1.7;
      color: #6b7280;
    }

    .process-token {
      flex: none;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef6f1;
      color: #1f7a4f;
      font-size: 12px;
      line-height: 1;
      border: 1px solid #d9ece0;
    }

    .process-card.skill-card .process-title {
      background: linear-gradient(90deg, #2563eb, #0ea5e9 45%, #7c3aed 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .process-card.skill-card .process-token {
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.10), rgba(121, 40, 202, 0.10));
      color: #4c51bf;
      border-color: rgba(99, 102, 241, 0.18);
    }

    .process-meta {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    .process-detail {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s ease, margin-top 0.28s ease;
      margin-top: 0;
    }

    .process-detail-inner {
      overflow: hidden;
    }

    .process-card.expanded .process-detail {
      grid-template-rows: 1fr;
      margin-top: 10px;
    }

    .detail-code {
      margin: 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #e5eaf0;
      color: #475569;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .suggest-block {
      margin-top: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.35s ease;
    }

    .suggest-block.show {
      opacity: 1;
      transform: translateY(0);
    }

    .suggest-title {
      margin-bottom: 10px;
      color: #4b5563;
      font-size: 14px;
    }

    .suggest-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .suggest-btn {
      border: 1px solid #d7dde5;
      background: #fff;
      color: #374151;
      font-size: 14px;
      line-height: 1;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .suggest-btn:hover {
      border-color: #9ed1b1;
      color: #1f7a4f;
      background: #f6fcf8;
    }

    .final-answer {
      min-height: 56px;
    }

    .foot-note {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .foot-note.show {
      opacity: 1;
    }

    .composer {
      position: sticky;
      bottom: 18px;
      max-width: 1070px;
      margin: 38px auto 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid #e8edf2;
      border-radius: 18px;
      min-height: 156px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.06);
      padding: 18px 22px 56px;
    }

    .chat-shell.landing .composer {
      width: min(1080px, 100%);
      margin-top: 0;
      position: relative;
      bottom: auto;
    }

    .composer-input {
      width: 100%;
      min-height: 78px;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: #1f2937;
      font-size: 15px;
      line-height: 1.8;
      font-family: inherit;
    }

    .composer-input::placeholder {
      color: #b0b8c3;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .tool-btn {
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid #d7dde5;
      background: #fff;
      color: #475569;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      border-color: #9ed1b1;
      color: #1f7a4f;
      background: #f6fcf8;
    }

    .composer-footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .agent-tag {
      height: 30px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid #9ed1b1;
      color: #1f7a4f;
      display: inline-flex;
      align-items: center;
      font-size: 14px;
      background: #f5fcf7;
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #b8ead0, #8bd6ae);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 18px rgba(139, 214, 174, 0.34);
    }

    .send-btn:hover {
      transform: translateY(-1px) scale(1.02);
    }

    .send-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      box-shadow: none;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1100px) {
      .sidebar {
        display: none;
      }

      .main {
        padding: 18px;
      }

      .agent-block {
        width: auto;
        margin-left: 0;
      }

      .composer {
        margin-top: 20px;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"></div>
      <button class="new-chat">新建对话</button>
      <div class="menu">
        <div class="menu-item active">问数智能体</div>
        <div class="menu-item">制度智能体</div>
        <div class="menu-item">运营分析报告</div>
        <div class="menu-item">项目会议指标智库</div>
        <div class="menu-item">职能知识库</div>
        <div class="menu-item">更多智能体</div>
      </div>
    </aside>

    <main class="main">
      <div class="header">
        <div class="header-badge"></div>
        <div>问数智能体</div>
      </div>

      <div id="chatShell" class="chat-shell landing">
        <div id="landingHero" class="landing-hero">
          <div class="landing-title">
            <span class="landing-bot">🤖</span>
            <span>Hi～ 我是小绿同学，<strong>问数智能体</strong></span>
          </div>
          <div class="landing-subtitle">
            货值、计划、认购、签约、回款、到访；人数统计、人才分析、招聘效能，这些数据我都有！您想查什么数，来问我吧～
          </div>
        </div>

        <div class="user-row hidden">
          <div class="user-bubble" id="userBubble"></div>
        </div>

        <div id="agentBlock" class="agent-block hidden">
          <div class="agent-header">
            <div class="agent-avatar">🤖</div>
            <div class="agent-status-wrap">
              <div id="agentStatus" class="agent-status">等待发送问题</div>
              <div class="typing-dots" id="typingDots">

    function renderMetrics(metrics) {
      metricGridEl.innerHTML = metrics.map(item => `
        <div class="metric-card fade-in">
          <div class="metric-label">${item.label}</div>
          <div class="metric-value">${item.value}</div>
          <div class="metric-trend">${item.trend}</div>
        </div>
      `).join("");
    }

    function renderHighlights(items) {
      highlightListEl.innerHTML = items.map(text => `
        <div class="highlight-item fade-in">
          <span class="highlight-bullet"></span>
          <span>${text}</span>
        </div>
      `).join("");
    }

    function renderTable(rows) {
      if (!rows || !rows.length) {
        tableCardEl.classList.remove("show");
        tableBodyEl.innerHTML = "";
        return;
      }

      tableBodyEl.innerHTML = rows.map(row => `
        <tr>
          <td>${row.month}</td>
          <td>${row.sales}</td>
          <td>${row.mom}</td>
          <td>${row.projects}</td>
        </tr>
      `).join("");
      tableCardEl.classList.add("show");
    }

    function renderLoadingState() {
      answerEl.classList.add("loading");
      answerEl.innerHTML = `
        <div class="summary-skeleton-line skeleton"></div>
        <div class="summary-skeleton-line skeleton" style="width: 42%"></div>
      `;
      metricGridEl.innerHTML = "";
      highlightListEl.innerHTML = "";
    }

    function addCard(card) {
      const node = document.createElement("div");
      node.className = `process-card${card.kind === "skill" ? " skill-card" : ""}`;
      node.innerHTML = `
        <div class="process-header-row">
          <div class="process-title">${card.title}</div>
          <div class="process-token">${card.tokens || 0} tokens</div>
        </div>
        <div class="process-desc">${card.desc}</div>
        <div class="process-meta">点击查看事件详情</div>
        <div class="process-detail">
          <div class="process-detail-inner">
            <pre class="detail-code">${card.detail || ""}</pre>
          </div>
        </div>
      `;
      node.addEventListener("click", () => {
        node.classList.toggle("expanded");
      });
      cardsEl.appendChild(node);
      requestAnimationFrame(() => node.classList.add("show"));
    }

    async function typeText(el, text, speed) {
      el.classList.remove("loading");
      el.textContent = "";
      for (let i = 0; i < text.length; i++) {
        el.textContent += text[i];
        await sleep(speed);
      }
    }

    function setAnswerStreamingState() {
      answerEl.classList.remove("loading");
      answerEl.innerHTML = `<span class="cursor">|</span>`;
    }

    function clearThoughtTimer() {
      if (thoughtTimer) {
        window.clearInterval(thoughtTimer);
        thoughtTimer = null;
      }
    }

    function startThoughtTimer() {
      clearThoughtTimer();
      thoughtStartTime = Date.now();
      thoughtTimer = window.setInterval(() => {
        const seconds = Math.max(1, Math.round((Date.now() - thoughtStartTime) / 1000));
        statusInlineTextEl.textContent = `已思考 ${seconds} 秒`;
      }, 250);
    }

    async function updateStatus(text) {
      statusEl.style.opacity = "0.35";
      statusEl.style.transform = "translateY(2px)";
      await sleep(130);
      statusEl.textContent = text;
      statusEl.style.opacity = "1";
      statusEl.style.transform = "translateY(0)";
    }

    function resetView() {
      chatShellEl.classList.add("landing");
      landingHeroEl.classList.remove("hidden");
      agentBlockEl.classList.add("hidden");
      cardsEl.innerHTML = "";
      answerEl.textContent = "";
      suggestEl.classList.remove("show");
      footNoteEl.classList.remove("show");
      typingDotsEl.style.display = "flex";
      statusEl.textContent = "等待发送问题";
      footNoteEl.textContent = "";
      statusInlineTextEl.textContent = "等待提问";
      metricGridEl.innerHTML = "";
      highlightListEl.innerHTML = "";
      answerEl.classList.remove("loading");
      document.querySelector(".result-card").classList.add("hidden");
      tableCardEl.classList.remove("show");
      tableBodyEl.innerHTML = "";
      downloadPanelEl.classList.remove("show");
      sendFeishuBtnEl.textContent = "发送到飞书";
      sendFeishuBtnEl.classList.remove("success");
      downloadBtnEl.textContent = "下载";
      downloadBtnEl.classList.remove("success");
      likeBtnEl.classList.remove("active");
      dislikeBtnEl.classList.remove("active");
      copyBtnEl.classList.remove("active");
      copyIconEl.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="10" height="10" rx="2"></rect>
          <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1"></path>
        </svg>
      `;
      eventStreamEl.classList.add("hidden");
      userRowEl.classList.add("hidden");
      clearThoughtTimer();
    }

    function setRunning(running) {
      isRunning = running;
      sendBtnEl.disabled = running;
      replayBtnEl.disabled = running;
      clearBtnEl.disabled = running;
      inputEl.disabled = running;
    }

    async function playFlow(question) {
      const runId = ++activeRunId;
      const scenario = buildScenario(question);
      const steps = scenario.timeline;

      resetView();
      setRunning(true);
      chatShellEl.classList.remove("landing");
      landingHeroEl.classList.add("hidden");
      agentBlockEl.classList.remove("hidden");
      userRowEl.classList.remove("hidden");
      eventStreamEl.classList.remove("hidden");
      userBubbleEl.textContent = question;
      renderLoadingState();
      statusInlineTextEl.textContent = "正在思考";
      startThoughtTimer();

      for (let i = 0; i < steps.length; i++) {
        if (runId !== activeRunId) {
          return;
        }

        const item = steps[i];
        await updateStatus(item.status);
        addCard(item.card);
        await sleep(item.delay);
      }

      if (runId !== activeRunId) {
        return;
      }

      await updateStatus("正在生成最终回答");
      clearThoughtTimer();
      statusInlineTextEl.textContent = "结果展示中";
      document.querySelector(".result-card").classList.remove("hidden");
      setAnswerStreamingState();
      await typeText(answerEl, scenario.finalText, 20);
      renderMetrics(scenario.metrics);
      await sleep(160);
      renderHighlights(scenario.highlights);
      if (scenario.tableData) {
        await sleep(180);
        renderTable(scenario.tableData);
      }
      suggestEl.classList.add("show");
      footNoteEl.textContent = scenario.footText;
      footNoteEl.classList.add("show");
      typingDotsEl.style.display = "none";
      await updateStatus("分析完成");
      statusInlineTextEl.textContent = "回答已生成";
      setRunning(false);
    }

    async function submitQuestion(question) {
      const nextQuestion = question.trim();
      if (!nextQuestion || isRunning) {
        return;
      }

      lastQuestion = nextQuestion;
      await playFlow(nextQuestion);
    }

    sendBtnEl.addEventListener("click", () => {
      submitQuestion(inputEl.value);
    });

    replayBtnEl.addEventListener("click", () => {
      if (lastQuestion) {
        inputEl.value = lastQuestion;
        submitQuestion(lastQuestion);
      }
    });

    clearBtnEl.addEventListener("click", () => {
      activeRunId += 1;
      setRunning(false);
      chatShellEl.classList.add("landing");
      landingHeroEl.classList.remove("hidden");
      agentBlockEl.classList.add("hidden");
      answerEl.textContent = "";
      cardsEl.innerHTML = "";
      suggestEl.classList.remove("show");
      footNoteEl.classList.remove("show");
      footNoteEl.textContent = "";
      typingDotsEl.style.display = "none";
      statusEl.textContent = "等待发送问题";
      statusInlineTextEl.textContent = "等待提问";
      metricGridEl.innerHTML = "";
      highlightListEl.innerHTML = "";
      document.querySelector(".result-card").classList.add("hidden");
      eventStreamEl.classList.add("hidden");
      userRowEl.classList.add("hidden");
      inputEl.value = "";
      clearThoughtTimer();
    });

    inputEl.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.ctrlKey) {
        event.preventDefault();
        submitQuestion(inputEl.value);
      }
    });

    suggestBtnEls.forEach(button => {
      button.addEventListener("click", () => {
        const query = button.dataset.query || button.textContent.trim();
        inputEl.value = query;
        submitQuestion(query);
      });
    });

    likeBtnEl.addEventListener("click", () => {
      likeBtnEl.classList.add("active");
      dislikeBtnEl.classList.remove("active");
    });

    dislikeBtnEl.addEventListener("click", () => {
      dislikeBtnEl.classList.add("active");
      likeBtnEl.classList.remove("active");
    });

    copyBtnEl.addEventListener("click", async () => {
      const text = answerEl.textContent.trim();
      if (!text) {
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
      } catch (error) {
      }
      copyBtnEl.classList.add("active");
      copyIconEl.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12l4 4 10-10"></path>
        </svg>
      `;
    });

    sendFeishuBtnEl.addEventListener("click", async () => {
      if (!tableCardEl.classList.contains("show")) {
        return;
      }
      sendFeishuBtnEl.textContent = "发送中...";
      await sleep(900);
      sendFeishuBtnEl.textContent = "已发送到飞书";
      sendFeishuBtnEl.classList.add("success");
    });

    downloadBtnEl.addEventListener("click", () => {
      downloadPanelEl.classList.toggle("show");
    });

    downloadItemEls.forEach(button => {
      button.addEventListener("click", async () => {
        const format = button.dataset.format;
        downloadPanelEl.classList.remove("show");
        downloadBtnEl.textContent = `下载${format}中...`;
        await sleep(700);
        downloadBtnEl.textContent = `已下载${format}`;
        downloadBtnEl.classList.add("success");
      });
    });

    resetView();
  </script>
</body>
</html>
