name: Update land tracker

on:
  schedule:
    # UTC 00:30 = Asia/Shanghai 08:30. GitHub may delay scheduled jobs.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only collect and validate; do not publish'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/land-tracker.yml'
      - 'scripts/*land_tracker*.py'
      - 'scripts/requirements-land-tracker.txt'
      - 'scripts/tests/test_land_tracker.py'
      - 'scripts/tests/test_land_tracker_enrichment.py'
      - 'scripts/tests/test_land_tracker_ui.cjs'
      - 'scripts/tests/fixtures/land_tracker/**'
      - 'scripts/tests/fixtures/land_tracker_enrichment/**'
      - 'data/land_tracker_identity_sources.json'

permissions:
  contents: read

concurrency:
  group: land-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-land-tracker.txt
      - name: Install dependencies
        run: |
          python -m pip install -r scripts/requirements-land-tracker.txt
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run parser and merge tests
        run: python -m unittest discover -s scripts/tests -p 'test_land_tracker*.py' -v
      - name: Test JavaScript syntax and evidence rendering
        run: node scripts/tests/test_land_tracker_ui.cjs
      - name: Test current page
        run: python scripts/test_land_tracker_browser.py
      - name: Collect and validate
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python scripts/update_land_tracker.py --dry-run
          else
            python scripts/update_land_tracker.py --apply
          fi
      - name: Collect project identities and permit milestones
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python scripts/update_land_tracker_enrichment.py --page reports/land-tracker/proposed.html --dry-run
          else
            python scripts/update_land_tracker_enrichment.py --page reports/land-tracker/proposed.html --apply
          fi
      - name: Test generated page
        run: python scripts/test_land_tracker_browser.py --page reports/land-tracker/proposed.html
      - name: Commit data changes
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add land_tracker_dashboard_20260614/index.html data/land_tracker_sources.json data/land_tracker_enrichment.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Beijing land transactions'
            git push origin HEAD:main
          fi
      - name: Rebuild Pages and verify public HTML
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_land_tracker.py
      - name: Write run summary
        if: always()
        run: |
          if [ -f reports/land-tracker/report.md ]; then
            cat reports/land-tracker/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/land-tracker/enrichment/report.md ]; then
            cat reports/land-tracker/enrichment/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save evidence and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: land-tracker-${{ github.run_id }}
          path: reports/land-tracker/
          retention-days: 30
          if-no-files-found: warn
