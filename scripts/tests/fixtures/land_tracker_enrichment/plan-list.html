<script>

$(function(){
    // 解析URL获取指定参数工具函数
    function getUrlParam(url, paramName) {
        if (!url) return null;
        try {
            const urlObj = new URL(url);
            return urlObj.searchParams.get(paramName);
        } catch (e) {
            // 兼容低版本浏览器异常捕获
            return null;
        }
    }

    // 获取来路referer地址
    const referUrl = document.referrer;
    if (referUrl) {
        // 提取三个搜索参数
        const titleVal = getUrlParam(referUrl, "filter_LIKE_TITLE");
        const keyVal = getUrlParam(referUrl, "filter_LIKE_KEYWORDS");
        const contentVal = getUrlParam(referUrl, "filter_LIKE_CONTENT");

        // 标记是否存在搜索条件
        let hasSearchCond = false;

        // 有值则回填对应输入框
        if (titleVal) {
            $("#ipt_xmfa").val(titleVal);
            hasSearchCond = true;
        }
        if (keyVal) {
            $("#ipt_jsdw").val(keyVal);
            hasSearchCond = true;
        }
        if (contentVal) {
            $("#ipt_xmbh").val(contentVal);
            hasSearchCond = true;
        }

        // 存在搜索条件，自动触发搜索按钮点击
        if (hasSearchCond) {
            // 替换成你页面实际搜索按钮选择器，如 .search-btn
            $(".btn").trigger("click");
        }
    }
});
