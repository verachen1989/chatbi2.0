<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />

<title>北京2025年以后真实成交住宅地块跟踪表</title>
<style>
:root {
  --bg:#f8fafc;
  --panel:#ffffff;
  --line:#dadce0;
  --line-soft:#e5e7eb;
  --text:#202124;
  --muted:#5f6368;
  --blue:#356bd8;
  --blue-dark:#12356f;
  --blue-soft:#eaf0ff;
  --green:#15803d;
  --green-soft:#f4faf5;
  --row-blue:#f2f6fd;
  --orange:#ea580c;
}
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
body { overflow:hidden; }
.app { height:100vh; display:grid; grid-template-rows:auto minmax(0, 1fr); background:var(--bg); }
.topbar { border-bottom:1px solid var(--line); background:rgba(255,255,255,.98); box-shadow:0 1px 3px rgba(60,64,67,.14); }
.filter-toolbar { min-height:50px; display:flex; align-items:center; gap:8px; padding:7px 14px; background:#fff; }
.search { width:min(300px, 24vw); height:36px; display:flex; align-items:center; border:1px solid var(--line); border-radius:5px; background:#fff; overflow:hidden; box-shadow:0 1px 2px rgba(60,64,67,.08); }
.search input { flex:1; min-width:0; height:100%; padding:0 12px; border:0; outline:0; color:var(--text); font:inherit; font-size:14px; }
.search-icon { width:42px; height:100%; display:grid; place-items:center; border:0; background:var(--blue); color:#fff; font-size:17px; font-weight:900; cursor:pointer; }
.filters { flex:1; min-width:0; display:flex; align-items:center; gap:8px; overflow:auto; scrollbar-width:none; }
select, .reset { height:36px; min-width:96px; max-width:168px; padding:0 28px 0 10px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--text); font:inherit; font-size:13px; font-weight:800; }
.reset { flex:0 0 auto; min-width:auto; padding:0 12px; color:#6b7280; cursor:pointer; }
.reset:hover { border-color:var(--blue); color:var(--blue); }
.result-count { flex:0 0 auto; color:var(--blue); font-size:13px; font-weight:950; white-space:nowrap; }
.stage { min-height:0; display:grid; grid-template-rows:minmax(0, 1fr); padding:10px 14px 14px; overflow:hidden; }
.table-panel { min-height:0; display:grid; grid-template-rows:minmax(0, 1fr); border:1px solid var(--line); border-radius:7px; background:#fff; box-shadow:0 6px 20px rgba(60,64,67,.14); overflow:hidden; }
.table-wrap { min-height:0; overflow:auto; background:#fff; }
table { width:max(100%, 1740px); border-collapse:collapse; table-layout:fixed; font-size:12px; }
col.seq { width:50px; }
col.land-name { width:270px; }
col.land-code { width:132px; }
col.project { width:138px; }
col.district { width:72px; }
col.plate { width:78px; }
col.date { width:108px; }
col.bidder { width:220px; }
col.brand { width:88px; }
col.amount { width:98px; }
col.floor { width:110px; }
col.node { width:104px; }
th, td { padding:9px 8px; border-bottom:1px solid #e4e9ef; border-right:1px solid #edf0f2; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
th { position:sticky; top:0; z-index:3; height:40px; background:#f3f5f8; color:#30343b; font-size:12px; font-weight:900; line-height:1.25; text-align:center; white-space:normal; }
td { height:46px; color:#252a31; line-height:1.35; background:#fff; }
tbody tr:nth-child(even) td { background:var(--row-blue); }
tbody tr:nth-child(even) td:nth-child(n+12) { background:var(--green-soft); }
tbody tr:nth-child(odd) td:nth-child(n+12) { background:#fbfdfb; }
tbody tr:hover td, tbody tr:hover td:nth-child(n+12) { background:#e9f1ff; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.center, th.center { text-align:center; }
td.empty { color:#a0a7b2; text-align:center; }
.sort-button { width:100%; min-height:24px; display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:0; border:0; background:transparent; color:inherit; font:inherit; font-weight:900; cursor:pointer; }
.sort-button:hover { color:var(--blue); }
.sort-icon { width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--blue-soft); color:var(--blue); font-size:11px; line-height:1; }
.sticky-1, .sticky-2, .sticky-3 { position:sticky; z-index:2; }
th.sticky-1, th.sticky-2, th.sticky-3 { z-index:4; }
.sticky-1 { left:0; }
.sticky-2 { left:50px; }
.sticky-3 { left:320px; }
tbody tr:nth-child(odd) .sticky-1, tbody tr:nth-child(odd) .sticky-2, tbody tr:nth-child(odd) .sticky-3 { background:#fff; }
tbody tr:nth-child(even) .sticky-1, tbody tr:nth-child(even) .sticky-2, tbody tr:nth-child(even) .sticky-3 { background:var(--row-blue); }
tbody tr:hover .sticky-1, tbody tr:hover .sticky-2, tbody tr:hover .sticky-3 { background:#e9f1ff; }
.tag { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; color:var(--blue); font-size:12px; font-weight:900; white-space:nowrap; }
.land-name-cell { font-weight:700; }
.land-link { width:100%; display:block; padding:0; border:0; background:transparent; color:var(--blue); font:inherit; font-weight:850; line-height:1.35; text-align:left; cursor:pointer; overflow:hidden; text-overflow:ellipsis; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
.land-link:hover { color:var(--blue-dark); text-decoration-thickness:2px; }
.land-link:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:3px; }
.status-line { margin-top:3px; color:#6b7280; font-size:11px; }
.map-modal { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(17,24,39,.46); }
.map-modal.open { display:flex; }
.map-panel { width:min(1040px, calc(100vw - 48px)); height:min(760px, calc(100vh - 48px)); display:grid; grid-template-rows:auto minmax(0, 1fr) auto; border-radius:8px; background:#fff; box-shadow:0 24px 80px rgba(15,23,42,.32); overflow:hidden; }
.map-header { min-height:54px; display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line-soft); }
.map-title { flex:1; min-width:0; }
.map-title strong { display:block; color:#111827; font-size:15px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.map-title span { display:block; margin-top:3px; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.map-close { width:32px; height:32px; border:1px solid var(--line); border-radius:5px; background:#fff; color:#4b5563; font-size:20px; line-height:1; cursor:pointer; }
.map-close:hover { border-color:var(--blue); color:var(--blue); }
#landMap { min-height:0; width:100%; height:100%; background:#eef2f7; }
.map-status { min-height:36px; display:flex; align-items:center; padding:8px 16px; border-top:1px solid var(--line-soft); color:#5f6368; font-size:12px; line-height:1.45; }
@media (max-width:1180px) {
  body { overflow:auto; }
  .app { min-height:100vh; height:auto; }
  .stage { overflow:visible; }
  .filter-toolbar { flex-wrap:wrap; }
  .search { width:100%; }
  .filters { flex-wrap:wrap; overflow:visible; }
}
@media (max-width:720px) {
  .filter-toolbar, .stage { padding-left:12px; padding-right:12px; }
}
</style>

function closeMapModal() {
  document.getElementById("mapModal").classList.remove("open");
  document.getElementById("mapModal").setAttribute("aria-hidden", "true");
}
function ensureMap() {
  if (!window.AMap) return false;
  if (!mapInstance) {
    mapInstance = new AMap.Map("landMap", {
      center: [116.407387, 39.904179],
      zoom: 11,
      viewMode: "2D",
      resizeEnable: true,
    });
    mapInstance.addControl(new AMap.Scale());
    mapInstance.addControl(new AMap.ToolBar({ position: { right: "18px", top: "18px" } }));
    mapGeocoder = new AMap.Geocoder({ city: "010", radius: 1000 });
  } else {
    mapInstance.resize();
  }
  return true;
}
function clearMapOverlay() {
  if (mapMarker) {
    mapInstance.remove(mapMarker);
    mapMarker = null;
  }
  if (mapCircle) {
    mapInstance.remove(mapCircle);
    mapCircle = null;
  }
  if (mapInfoWindow) {
    mapInfoWindow.close();
  }
}
function fallbackPosition(row) {
  const landHint = LAND_HINT_CENTERS.find(([keyword]) => row.landName && row.landName.includes(keyword));
  if (landHint) return { position: landHint[1], radius: landHint[2], label: "按地块片区关键词“" + landHint[0] + "”近似定位" };
  const platePoint = PLATE_CENTERS[row.plate];
  if (platePoint) return { position: platePoint, radius: 1800, label: "按板块“" + row.plate + "”近似定位" };
  const districtPoint = DISTRICT_CENTERS[row.district];
  if (districtPoint) return { position: districtPoint, radius: 5000, label: "按行政区“" + row.district + "”近似定位" };
  return { position: [116.407387, 39.904179], radius: 8000, label: "按北京市中心兜底定位" };
}
function drawLandPoint(row, position, statusText, zoom = 13, radius = 1000) {
  clearMapOverlay();
  mapCircle = new AMap.Circle({
    center: position,
    radius,
    strokeColor: "#356bd8",
    strokeOpacity: 0.85,
    strokeWeight: 2,
    fillColor: "#356bd8",
    fillOpacity: 0.12,
  });
  mapMarker = new AMap.Marker({
    position,
    title: row.landName,
    anchor: "bottom-center",
  });
  mapInstance.add(mapCircle);
  mapInstance.add(mapMarker);
  mapInstance.setZoomAndCenter(zoom, position);
  mapInfoWindow = new AMap.InfoWindow({
    offset: new AMap.Pixel(0, -32),
    content: '<div style="max-width:320px;padding:4px 2px;line-height:1.55;font-size:12px;"><strong style="font-size:13px;">' + html(row.landName) + '</strong><br/>地块编号：' + display(row.landCode) + '<br/>成交时间：' + display(row.dealDate) + '<br/>竞得单位：' + display(row.bidder) + '</div>',
  });
  mapInfoWindow.open(mapInstance, position);
  setMapStatus(statusText);
}
function geocodeAddress(address) {
  return new Promise((resolve) => {
    const timer = window.setTimeout(() => resolve(null), 2800);
    mapGeocoder.getLocation(address, (status, result) => {
      window.clearTimeout(timer);
      if (status === "complete" && result.geocodes && result.geocodes.length) {
        resolve(result.geocodes[0]);
      } else {
        resolve(null);
      }
    });
  });
}
async function locateLandOnMap(row) {
  if (!ensureMap()) {
    setMapStatus("高德地图脚本未加载成功，请检查网络或 API Key。");
    return;
  }
  const fallback = fallbackPosition(row);
  drawLandPoint(row, fallback.position, fallback.label + "；蓝色圆圈为近似范围，正在尝试高德地理编码精确定位...", fallback.label.includes("行政区") ? 11 : 14, fallback.radius);
  const queries = [
    buildMapQuery(row),
    ["北京市", row.district, row.projectName].filter(Boolean).join(""),
    ["北京市", row.district, row.plate].filter(Boolean).join(""),
  ].filter(Boolean);
  let geocode = null;
  let matchedQuery = "";
  for (const query of queries) {
    geocode = await geocodeAddress(query);
    matchedQuery = query;
    if (geocode) break;
  }
  if (!geocode) {
    setMapStatus(fallback.label + "；蓝色圆圈为近似范围，高德地理编码未返回更精确结果，非地块红线边界。");
    return;
  }
  drawLandPoint(row, geocode.location, "定位结果来自高德地理编码：" + matchedQuery + "；蓝色圆圈为近似范围，非地块红线边界。", 15, 700);
}
document.getElementById("searchInput").addEventListener("input", event => { state.search = event.target.value; render(); });
document.getElementById("searchButton").addEventListener("click", render);
document.getElementById("districtFilter").addEventListener("change", event => { state.district = event.target.value; render(); });
document.getElementById("plateFilter").addEventListener("change", event => { state.plate = event.target.value; render(); });
document.getElementById("brandFilter").addEventListener("change", event => { state.brand = event.target.value; render(); });
document.getElementById("landDateFilter").addEventListener("change", event => { state.landYear = event.target.value; render(); });
document.getElementById("nodeFilter").addEventListener("change", event => { state.node = event.target.value; render(); });
document.getElementById("dealDateSort").addEventListener("click", () => {
  state.dealSort = state.dealSort === "desc" ? "asc" : "desc";
  render();
});
document.getElementById("tableBody").addEventListener("click", event => {
  const button = event.target.closest("[data-land-seq]");
  if (!button) return;
  const row = LAND_ROWS.find(item => String(item.seq) === button.dataset.landSeq);
  if (row) showMapModal(row);
});
document.getElementById("mapClose").addEventListener("click", closeMapModal);
document.getElementById("mapModal").addEventListener("click", event => {
  if (event.target.id === "mapModal") closeMapModal();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeMapModal();
});
document.getElementById("resetFilters").addEventListener("click", () => {
  state.search = ""; state.district = ""; state.plate = ""; state.brand = ""; state.landYear = ""; state.node = ""; state.dealSort = "desc";
  document.getElementById("searchInput").value = "";
  document.getElementById("districtFilter").value = "";
  document.getElementById("plateFilter").value = "";
  document.getElementById("brandFilter").value = "";
  document.getElementById("landDateFilter").value = "";
  document.getElementById("nodeFilter").value = "";
  render();
});
render();
</script>
